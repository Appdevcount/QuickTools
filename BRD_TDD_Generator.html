<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRD & TDD Generator — QuickTools</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#0f172a;--sb2:#1e293b;--sb3:#334155;
  --accent:#6366f1;--accent-h:#4f46e5;--accent-light:#eef2ff;
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--danger:#ef4444;
  --green:#16a34a;--amber:#d97706;--purple:#7c3aed;--teal:#0d9488;
  --r:8px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}

/* ── Sidebar ── */
#sb{width:260px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sb-head{padding:14px 14px 12px;border-bottom:1px solid var(--sb2);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:8px;color:#f1f5f9;font-size:15px;font-weight:800}
.sb-logo-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-sub{font-size:10px;color:#475569;margin-top:3px;padding-left:2px}

/* doc type toggle */
.dt-toggle{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--sb2);flex-shrink:0}
.dt-btn{flex:1;padding:5px 4px;border:1px solid var(--sb3);background:transparent;color:#64748b;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s}
.dt-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* section nav */
.sb-nav{flex:1;overflow-y:auto;padding:6px 0}
.sb-group{padding:8px 12px 4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#475569}
.sb-item{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;border-left:2px solid transparent;transition:all .12s;color:#94a3b8;font-size:12px}
.sb-item:hover{background:var(--sb2);color:#e2e8f0}
.sb-item.active{background:#1e293b;border-left-color:var(--accent);color:#c7d2fe}
.sb-item-num{font-size:10px;color:#334155;font-family:monospace;width:18px;flex-shrink:0;text-align:right}
.sb-item.active .sb-item-num{color:#818cf8}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:#334155}
.sb-dot.done{background:var(--green)}
.sb-dot.partial{background:var(--amber)}

/* sidebar footer */
.sb-footer{padding:10px 10px;border-top:1px solid var(--sb2);flex-shrink:0;display:flex;flex-wrap:wrap;gap:5px}
.sb-btn{flex:1;min-width:56px;background:transparent;color:#64748b;border:1px solid #1e293b;border-radius:6px;padding:6px 4px;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.sb-btn:hover{background:var(--sb2);color:#94a3b8}
.sb-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.sb-btn.accent:hover{background:var(--accent-h)}
.sb-btn.danger{border-color:#450a0a;color:#f87171}
.sb-btn.danger:hover{background:#450a0a}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.topbar-title{font-size:15px;font-weight:800;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px}
.topbar-title input{border:none;outline:none;font-size:15px;font-weight:800;color:var(--text);width:100%;background:transparent;font-family:inherit}
.topbar-title input::placeholder{color:#94a3b8;font-weight:400}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid transparent}
.s-draft{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.s-review{background:#fffbeb;color:#92400e;border-color:#fde68a}
.s-approved{background:#f0fdf4;color:#14532d;border-color:#bbf7d0}
.s-rejected{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.topbar-actions{display:flex;gap:6px;flex-shrink:0}
.btn{padding:6px 13px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;transition:all .18s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:#f8fafc;border-color:#94a3b8}
.btn-green{background:#15803d;color:#fff}
.btn-green:hover{background:#166534}
.btn-amber{background:#92400e;color:#fef3c7;border:1px solid #fde68a}
.btn-danger{background:transparent;border:1px solid #fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}

/* ── Form ── */
#form{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg)}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;background:#fafafa}
.sec-head:hover{background:#f1f5f9}
.sec-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sec-brd .sec-icon{background:#eef2ff;color:var(--accent)}
.sec-tdd .sec-icon{background:#f0fdf4;color:var(--teal)}
.sec-title{font-size:12.5px;font-weight:800;color:var(--text);flex:1}
.sec-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.badge-brd{background:#eef2ff;color:#4f46e5}
.badge-tdd{background:#f0fdf4;color:#0d9488}
.sec-chevron{font-size:11px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.sec-chevron.open{transform:rotate(90deg)}
.sec-body{padding:14px 16px;display:none}
.sec-body.open{display:block}
.sec-progress{height:2px;background:#e2e8f0;flex-shrink:0;width:60px;border-radius:2px;overflow:hidden}
.sec-progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width .3s}

/* form fields */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g1{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field.span2{grid-column:span 2}
.field.span3{grid-column:span 3}
label{font-size:11.5px;font-weight:700;color:#334155;display:flex;align-items:center;gap:5px}
label .req{color:var(--danger)}
label .hint{font-size:10px;font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=email],input[type=url],select,textarea{
  border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;
  font-family:inherit;background:#fff;color:var(--text);transition:border .15s,box-shadow .15s;outline:none;width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
select option{font-size:13px}
.hint-text{font-size:11px;color:var(--muted);margin-top:2px}
.field-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}

/* chip multi-select */
.chip-group{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;min-height:38px}
.chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#f8fafc;color:var(--muted);transition:all .12s;user-select:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on.green{background:#15803d;border-color:#15803d}
.chip.on.amber{background:#d97706;border-color:#d97706}
.chip.on.red{background:#dc2626;border-color:#dc2626}
.chip.on.teal{background:var(--teal);border-color:var(--teal)}

/* dynamic tables */
.dyn-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.dyn-table th{background:#f8fafc;padding:7px 8px;text-align:left;font-size:10.5px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);white-space:nowrap}
.dyn-table td{padding:4px 4px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.dyn-table tr:last-child td{border-bottom:none}
.dyn-table input,.dyn-table select,.dyn-table textarea{border:1px solid transparent;border-radius:4px;padding:4px 6px;font-size:12px;background:transparent;width:100%;font-family:inherit;color:var(--text);transition:border .12s;resize:none}
.dyn-table input:hover,.dyn-table select:hover,.dyn-table textarea:hover,.dyn-table input:focus,.dyn-table select:focus,.dyn-table textarea:focus{border-color:var(--border);background:#fff;outline:none}
.dyn-table input:focus,.dyn-table select:focus,.dyn-table textarea:focus{border-color:var(--accent)}
.dyn-table .del-btn{background:transparent;border:none;cursor:pointer;color:#fca5a5;font-size:13px;padding:3px;border-radius:4px;transition:all .12s;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.dyn-table .del-btn:hover{background:#fef2f2;color:var(--danger)}
.add-row-btn{display:flex;align-items:center;gap:5px;margin-top:6px;padding:5px 10px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;width:100%;justify-content:center}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

/* priority chips in table */
.p-critical{background:#fef2f2!important;color:#991b1b!important}
.p-high{background:#fff7ed!important;color:#9a3412!important}
.p-medium{background:#fffbeb!important;color:#92400e!important}
.p-low{background:#f0fdf4!important;color:#166534!important}
.p-info{background:#eff6ff!important;color:#1e40af!important}

/* section dividers */
.sec-divider{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}

/* NFR cards */
.nfr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nfr-card{background:#fafafa;border:1px solid var(--border);border-radius:7px;padding:12px}
.nfr-card-title{font-size:11px;font-weight:800;color:#334155;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#f1f5f9;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:280px}
#toast.show{opacity:1;transform:translateY(0)}

/* preview modal */
#preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#preview-overlay.open{display:flex}
#preview-box{background:var(--surface);border-radius:12px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.preview-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.preview-head h3{font-size:14px;font-weight:800}
.preview-body{flex:1;overflow-y:auto;padding:20px}
.preview-actions{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* print-ready document styles (used in export) */
.doc-page{font-family:'Segoe UI',system-ui,sans-serif;max-width:900px;margin:0 auto;color:#0f172a;font-size:14px;line-height:1.6}
.doc-cover{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;padding:48px;border-radius:12px;margin-bottom:32px}
.doc-cover h1{font-size:32px;font-weight:800;margin-bottom:8px}
.doc-cover .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:24px;font-size:13px;opacity:.85}
.doc-section{margin-bottom:28px}
.doc-section h2{font-size:18px;font-weight:800;color:#1e1b4b;border-bottom:2px solid #e2e8f0;padding-bottom:8px;margin-bottom:14px}
.doc-section h3{font-size:14px;font-weight:700;color:#334155;margin-bottom:8px;margin-top:14px}
.doc-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.doc-table th{background:#f8fafc;padding:8px 10px;text-align:left;font-weight:700;border:1px solid #e2e8f0;font-size:12px}
.doc-table td{padding:8px 10px;border:1px solid #e2e8f0;vertical-align:top}
.doc-table tr:nth-child(even) td{background:#fafafa}

/* hidden file input */
#file-input{display:none}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
#form::-webkit-scrollbar-thumb{background:#cbd5e1}
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside id="sb">
  <div class="sb-head">
    <div class="sb-logo">
      <div class="sb-logo-icon">📄</div>
      BRD / TDD Generator
    </div>
    <div class="sb-sub">Business &amp; Technical Requirements</div>
  </div>

  <div class="dt-toggle">
    <button class="dt-btn on" id="dt-brd" onclick="setDocType('brd')">BRD Only</button>
    <button class="dt-btn" id="dt-both" onclick="setDocType('both')">Both</button>
    <button class="dt-btn" id="dt-tdd" onclick="setDocType('tdd')">TDD Only</button>
  </div>

  <div class="sb-nav" id="sb-nav">
    <!-- dynamically filled -->
  </div>

  <div class="sb-footer">
    <button class="sb-btn accent" onclick="exportJSON()" title="Save to JSON file">⬇ Export</button>
    <button class="sb-btn" onclick="document.getElementById('file-input').click()" title="Load JSON file">⬆ Import</button>
    <button class="sb-btn" onclick="showPreview()" title="Preview document">👁 Preview</button>
    <button class="sb-btn" onclick="exportHTML()" title="Export as HTML document">📄 Export HTML</button>
    <button class="sb-btn danger" onclick="confirmReset()" title="Start fresh">↺ Reset</button>
    <input type="file" id="file-input" accept=".json" onchange="importJSON(event)">
  </div>
</aside>

<!-- ── MAIN ── -->
<main id="main">
  <div class="topbar">
    <div class="topbar-title">
      <input type="text" id="doc-title" placeholder="Document Title…" oninput="markDirty()">
    </div>
    <select id="doc-status" class="btn btn-outline" style="padding:5px 10px;font-size:11px;font-weight:700;width:auto" onchange="updateStatusBadge()">
      <option value="draft">Draft</option>
      <option value="review">In Review</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
    <div class="topbar-actions">
      <button class="btn btn-green btn-sm" onclick="saveToLocal()">💾 Save</button>
      <button class="btn btn-primary btn-sm" onclick="exportHTML()">⬇ Export HTML</button>
    </div>
  </div>

  <div id="form">
    <!-- sections injected by JS -->
  </div>
</main>

<!-- ── PREVIEW MODAL ── -->
<div id="preview-overlay">
  <div id="preview-box">
    <div class="preview-head">
      <h3>Document Preview</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary btn-sm" onclick="exportHTML()">⬇ Export HTML</button>
        <button class="btn btn-outline btn-sm" onclick="closePreview()">✕ Close</button>
      </div>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════════════
let docType = 'brd';
let dirty = false;

const STORAGE_KEY = 'quicktools_brd_tdd';

const BRD_SECTIONS = [
  { id:'docinfo',   icon:'🗂️',  label:'Document Info',          group:'BRD' },
  { id:'exec',      icon:'📌',  label:'Executive Summary',       group:'BRD' },
  { id:'objectives',icon:'🎯',  label:'Business Objectives',     group:'BRD' },
  { id:'scope',     icon:'📐',  label:'Scope',                   group:'BRD' },
  { id:'stakeholders',icon:'👥',label:'Stakeholders',            group:'BRD' },
  { id:'funreq',    icon:'📋',  label:'Functional Requirements', group:'BRD' },
  { id:'nfr',       icon:'⚙️',  label:'Non-Functional Req.',     group:'BRD' },
  { id:'userstories',icon:'👤', label:'User Stories',            group:'BRD' },
  { id:'assumptions',icon:'💡', label:'Assumptions & Constraints',group:'BRD'},
  { id:'dependencies',icon:'🔗',label:'Dependencies',            group:'BRD' },
  { id:'milestones', icon:'🗓️', label:'Timeline & Milestones',   group:'BRD' },
  { id:'risks',     icon:'⚠️',  label:'Risks & Mitigations',     group:'BRD' },
  { id:'kpis',      icon:'📊',  label:'Success Metrics / KPIs',  group:'BRD' },
  { id:'approvals', icon:'✅',  label:'Approvals',               group:'BRD' },
];

const TDD_SECTIONS = [
  { id:'t-arch',    icon:'🏗️',  label:'Architecture Overview',   group:'TDD' },
  { id:'t-stack',   icon:'🧱',  label:'Tech Stack',              group:'TDD' },
  { id:'t-components',icon:'🧩',label:'System Components',       group:'TDD' },
  { id:'t-api',     icon:'🔌',  label:'API Design',              group:'TDD' },
  { id:'t-data',    icon:'🗃️',  label:'Data Model',              group:'TDD' },
  { id:'t-security',icon:'🔒',  label:'Security Design',         group:'TDD' },
  { id:'t-scale',   icon:'📈',  label:'Scalability & Performance',group:'TDD'},
  { id:'t-deploy',  icon:'🚀',  label:'Deployment',              group:'TDD' },
  { id:'t-monitor', icon:'📡',  label:'Monitoring & Observability',group:'TDD'},
  { id:'t-testing', icon:'🧪',  label:'Testing Strategy',        group:'TDD' },
  { id:'t-migration',icon:'🔄', label:'Migration Plan',          group:'TDD' },
  { id:'t-issues',  icon:'🐛',  label:'Open Issues',             group:'TDD' },
];

// ═══════════════════════════════════════════════════════════
// SIDEBAR NAV BUILDER
// ═══════════════════════════════════════════════════════════
function buildNav() {
  const nav = document.getElementById('sb-nav');
  let html = '';
  const sections = getActiveSections();
  let lastGroup = '';
  sections.forEach((s, i) => {
    if (s.group !== lastGroup) {
      html += `<div class="sb-group">${s.group}</div>`;
      lastGroup = s.group;
    }
    html += `<div class="sb-item" id="nav-${s.id}" onclick="scrollToSection('${s.id}')">
      <span class="sb-item-num">${i+1}</span>
      <span>${s.icon}</span>
      <span style="flex:1">${s.label}</span>
      <span class="sb-dot" id="dot-${s.id}"></span>
    </div>`;
  });
  nav.innerHTML = html;
}

function getActiveSections() {
  if (docType === 'brd') return BRD_SECTIONS;
  if (docType === 'tdd') return TDD_SECTIONS;
  return [...BRD_SECTIONS, ...TDD_SECTIONS];
}

function scrollToSection(id) {
  const el = document.getElementById('sec-' + id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    openSection(id);
  }
  document.querySelectorAll('.sb-item').forEach(x => x.classList.remove('active'));
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
}

function openSection(id) {
  const body = document.querySelector(`#sec-${id} .sec-body`);
  const chev = document.querySelector(`#sec-${id} .sec-chevron`);
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    if (chev) chev.classList.add('open');
  }
}

function toggleSection(id) {
  const body = document.querySelector(`#sec-${id} .sec-body`);
  const chev = document.querySelector(`#sec-${id} .sec-chevron`);
  if (!body) return;
  body.classList.toggle('open');
  if (chev) chev.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════
// FORM BUILDER
// ═══════════════════════════════════════════════════════════
function buildForm() {
  const form = document.getElementById('form');
  let html = '';
  const sections = getActiveSections();
  sections.forEach(s => {
    const isTdd = s.group === 'TDD';
    html += `<div class="section" id="sec-${s.id}">
      <div class="sec-head ${isTdd?'sec-tdd':'sec-brd'}" onclick="toggleSection('${s.id}')">
        <div class="sec-icon">${s.icon}</div>
        <span class="sec-title">${s.label}</span>
        <span class="sec-badge ${isTdd?'badge-tdd':'badge-brd'}">${s.group}</span>
        <span class="sec-chevron" id="chev-${s.id}">▶</span>
      </div>
      <div class="sec-body" id="body-${s.id}">${getSectionBody(s.id)}</div>
    </div>`;
  });
  form.innerHTML = html;

  // open first section by default
  const first = sections[0];
  if (first) {
    document.querySelector(`#sec-${first.id} .sec-body`).classList.add('open');

// ── HELPERS ──
function field(id, label, type='text', placeholder='', hint='', req=false) {
  const inp = type === 'textarea'
    ? `<textarea id="${id}" placeholder="${placeholder}" oninput="markDirty()"></textarea>`
    : `<input type="${type}" id="${id}" placeholder="${placeholder}" oninput="markDirty()">`;
  return `<div class="field"><label for="${id}">${label}${req?'<span class="req">*</span>':''} ${hint?`<span class="hint">${hint}</span>`:''}</label>${inp}</div>`;
}

function sel(id, label, options, hint='') {
  const opts = options.map(o => typeof o === 'string'
    ? `<option>${o}</option>`
    : `<option value="${o.v}">${o.l}</option>`).join('');
  return `<div class="field"><label for="${id}">${label} ${hint?`<span class="hint">${hint}</span>`:''}</label>
    <select id="${id}" onchange="markDirty()">${opts}</select></div>`;
}

function chips(id, label, items, color='') {
  const cs = items.map(c => `<span class="chip ${color}" onclick="toggleChip(this,'${id}')" data-val="${c}">${c}</span>`).join('');
  return `<div class="field"><label>${label}</label><div class="chip-group" id="${id}">${cs}</div></div>`;
}

function dynTable(id, cols, label='') {
  const ths = cols.map(c => `<th>${c.label}</th>`).join('') + '<th style="width:30px"></th>';
  return `${label?`<div class="sec-divider">${label}</div>`:''}
  <div style="overflow-x:auto">
  <table class="dyn-table" id="tbl-${id}">
    <thead><tr>${ths}</tr></thead>
    <tbody id="tbody-${id}"></tbody>
  </table>
  </div>
  <button class="add-row-btn" onclick="addRow('${id}')">＋ Add Row</button>`;
}

function toggleChip(el, groupId) {
  el.classList.toggle('on');
  markDirty();
}

function cellInput(col) {
  col = col.toLowerCase();
  if (col.includes('priority'))   return `<select onchange="updateRowStyle(this);markDirty()">${PRIORITY_OPTS}</select>`;
  if (col === 'dep status')       return `<select onchange="markDirty()">${DEP_STATUS}</select>`;
  if (col.includes('status'))     return `<select onchange="markDirty()">${STATUS_OPTS}</select>`;
  if (col.includes('raci'))       return `<select onchange="markDirty()">${RACI_OPTS}</select>`;
  if (col === 'method')           return `<select onchange="markDirty()">${METHOD_OPTS}</select>`;
  if (col.includes('likelihood')) return `<select onchange="markDirty()">${LH_OPTS}</select>`;
  if (col === 'dep type')         return `<select onchange="markDirty()">${DEP_TYPE}</select>`;
  if (col === 'type')             return `<select onchange="markDirty()">${COMP_TYPE}</select>`;
  if (col === 'category')         return `<input type="text" placeholder="Category" oninput="markDirty()">`;
  if (col.includes('impact') && !col.includes('if')) return `<select onchange="markDirty()">${LH_OPTS}</select>`;
  if (col.includes('date'))       return `<input type="date" oninput="markDirty()">`;
  if (col === 'issue cat')        return `<select onchange="markDirty()">${ISSUE_CAT}</select>`;
  if (col.includes('story') || col.includes('accept') || col.includes('criteria') ||
      col.includes('notes') || col.includes('resolution') || col.includes('mitigation') ||
      col.includes('rationale') || col.includes('desc') || col.includes('responsibility') ||
      col.includes('request') || col.includes('response') || col.includes('consumes') ||
      col.includes('exposes') || col.includes('impact if')) {
    return `<textarea rows="2" placeholder="…" oninput="markDirty()" style="min-height:40px"></textarea>`;
  }
  return `<input type="text" placeholder="…" oninput="markDirty()">`;
}

function addRow(tableId) {
  const tbody = document.getElementById('tbody-' + tableId);
  if (!tbody) return;
  const cols = TABLE_CONFIGS[tableId] || [];
  const tr = document.createElement('tr');
  tr.innerHTML = cols.map(c => `<td>${cellInput(c)}</td>`).join('')
    + `<td><button class="del-btn" onclick="this.closest('tr').remove();markDirty()" title="Remove">✕</button></td>`;
  tbody.appendChild(tr);
  markDirty();
}

function updateRowStyle(sel) {
  const val = sel.value.toLowerCase();
  sel.className = '';
  if (val === 'critical') sel.className = 'p-critical';
  else if (val === 'high') sel.className = 'p-high';
  else if (val === 'medium') sel.className = 'p-medium';
  else if (val === 'low') sel.className = 'p-low';
}

// ═══════════════════════════════════════════════════════════
// DIRTY / SAVE / LOAD
// ═══════════════════════════════════════════════════════════
let dirtyTimer;
function markDirty(d=true) {
  dirty = d;
  clearTimeout(dirtyTimer);
  if (d) dirtyTimer = setTimeout(saveToLocal, 3000);
}

function collectFormData() {
  const data = { docType, meta: {}, brd: {}, tdd: {} };
  document.querySelectorAll('[id]').forEach(el => {
    const id = el.id;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') data.meta[id] = el.value;
    else if (el.tagName === 'SELECT') data.meta[id] = el.value;
  });
  // collect chip groups
  document.querySelectorAll('.chip-group').forEach(g => {
    data.meta[g.id] = [...g.querySelectorAll('.chip.on')].map(c => c.dataset.val);
  });
  // collect dynamic tables
  Object.keys(TABLE_CONFIGS).forEach(tid => {
    const tbody = document.getElementById('tbody-' + tid);
    if (!tbody) return;
    data.meta['tbl-' + tid] = [...tbody.querySelectorAll('tr')].map(tr =>
      [...tr.querySelectorAll('input,select,textarea')].map(inp => inp.value)
    );
  });
  return data;
}

function restoreFormData(data) {
  if (!data) return;
  Object.entries(data.meta || {}).forEach(([id, val]) => {
    if (id.startsWith('tbl-')) return; // handled separately
    if (Array.isArray(val)) {
      const grp = document.getElementById(id);
      if (grp) grp.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('on', val.includes(c.dataset.val));
      });
    } else {
      const el = document.getElementById(id);
      if (el) el.value = val;
    }
  });
  // restore tables
  Object.keys(TABLE_CONFIGS).forEach(tid => {
    const rows = (data.meta || {})['tbl-' + tid];
    const tbody = document.getElementById('tbody-' + tid);
    if (!tbody || !rows) return;
    tbody.innerHTML = '';
    rows.forEach(rowVals => {
      addRow(tid);
      const lastRow = tbody.lastElementChild;
      const inputs = lastRow.querySelectorAll('input,select,textarea');
      rowVals.forEach((v, i) => { if (inputs[i]) inputs[i].value = v; });
    });
  });
}

function saveToLocal() {
  const data = collectFormData();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  markDirty(false);
  toast('Saved to browser storage');
}

function loadFromLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    restoreFormData(data);
  } catch(e) {}
}

// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════
function exportJSON() {
  const data = collectFormData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const title = (document.getElementById('doc-title') || {}).value || 'document';
  a.href = url;
  a.download = `brd-tdd-${title.replace(/[^a-z0-9]/gi,'_').toLowerCase()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported JSON');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.docType) {
        docType = data.docType;
        ['brd','both','tdd'].forEach(t => document.getElementById('dt-'+t).classList.toggle('on', t === data.docType));
        buildNav();
        buildForm();
      }
      restoreFormData(data);
      toast('Imported successfully');
    } catch(err) {
      toast('Error reading file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

<div class="doc-page">
  <div class="doc-cover">
    <div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">
      ${docType === 'brd' ? 'Business Requirements Document' : docType === 'tdd' ? 'Technical Design Document' : 'BRD + Technical Design Document'}
    </div>
    <h1>${title}</h1>
    <div class="sub">${m['di-project'] || ''} ${m['di-dept'] ? '· ' + m['di-dept'] : ''}</div>

    <div class="meta-grid" style="margin-top:20px">
      <div><span>Version</span><strong>${m['di-version'] || '—'}</strong></div>
      <div><span>Date</span><strong>${m['di-date'] || '—'}</strong></div>
      <div><span>Author</span><strong>${m['di-author'] || '—'}</strong></div>
      <div><span>Sponsor</span><strong>${m['di-sponsor'] || '—'}</strong></div>
      <div><span>Project Type</span><strong>${m['di-type'] || '—'}</strong></div>
      <div><span>Confidentiality</span><strong>${m['di-conf'] || '—'}</strong></div>
    </div>
  </div>
  ${m['di-desc'] ? `<div class="doc-section"><h2>Project Description</h2><p>${m['di-desc']}</p></div>` : ''}
  ${brdHTML}
  ${tddHTML}
  <p style="text-align:center;color:#94a3b8;font-size:11px;margin-top:32px">Generated by QuickTools BRD/TDD Generator · ${new Date().toLocaleDateString()}</p>
</div></body></html>`;
}

function exportHTML() {
  const html = generateDocHTML(true);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const title = (document.getElementById('doc-title') || {}).value || 'document';
  a.href = url;
  a.download = `${title.replace(/[^a-z0-9]/gi,'_').toLowerCase() || 'brd-tdd'}.html`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported HTML document');
}

function showPreview() {
  const html = generateDocHTML(false);
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:none';
  const body = document.getElementById('preview-body');
  body.innerHTML = '';
  body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(html);
  iframe.contentDocument.close();
  document.getElementById('preview-overlay').classList.add('open');
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('open');
}

function confirmReset() {
  if (confirm('Reset all form data? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    buildForm();
    document.getElementById('doc-title').value = '';
    document.getElementById('doc-status').value = 'draft';
    toast('Form reset');
  }
}

function updateStatusBadge() { markDirty(); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════════════════════════
// SCROLL SPY
// ═══════════════════════════════════════════════════════════
function initScrollSpy() {
  const form = document.getElementById('form');
  form.addEventListener('scroll', () => {
    const sections = getActiveSections();
    let active = null;
    sections.forEach(s => {
      const el = document.getElementById('sec-' + s.id);
      if (!el) return;
      if (el.getBoundingClientRect().top < 120) active = s.id;
    });
    if (active) {
      document.querySelectorAll('.sb-item').forEach(x => x.classList.remove('active'));
      const nav = document.getElementById('nav-' + active);
      if (nav) nav.classList.add('active');
    }
  }, { passive: true });
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(function init() {
  buildNav();
  buildForm();
  loadFromLocal();
  initScrollSpy();
})();
</script>
