<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDLC Task Planner — QuickTools</title>
<style>
:root{
  --bg:#f5f6ff;--surface:#fff;--surface2:#f0f1fe;--border:#dfe1f7;
  --accent:#4f46e5;--accent2:#6366f1;--accentSoft:#eef0ff;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#2563eb;--slate:#64748b;
  --text:#1e293b;--muted:#64748b;--radius:11px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hdr{background:linear-gradient(135deg,#4338ca,#6366f1);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 2px 14px rgba(79,70,229,.28);}
.hdr-icon{width:40px;height:40px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.hdr-title{font-size:17px;font-weight:700;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.82);margin-top:2px;}
.hdr-actions{margin-left:auto;display:flex;gap:8px;}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap;font-family:inherit;}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);}
.btn-ghost:hover{background:rgba(255,255,255,.3);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#4338ca;}
.btn-soft{background:var(--accentSoft);border:1px solid var(--border);color:var(--accent);}
.btn-soft:hover{background:#e0e3ff;}
.btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:4px 10px;font-size:11px;}
.app{flex:1;display:flex;overflow:hidden;}
.sb{width:238px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0;flex-shrink:0;}
.sb-lbl{padding:13px 14px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-top:1px solid var(--border);margin-top:6px;}
.sb-lbl:first-child{border-top:none;margin-top:0;padding-top:10px;}
.sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 14px;border:none;border-left:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:500;text-align:left;transition:all .15s;}
.sb-btn .lbl{display:flex;align-items:center;gap:8px;min-width:0;}
.sb-btn .lbl .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-btn:hover{background:var(--surface2);color:var(--text);}
.sb-btn.on{background:var(--accentSoft);border-left-color:var(--accent);color:var(--accent);font-weight:700;}
.sb-pct{font-size:10px;background:var(--border);border-radius:99px;padding:1px 7px;color:var(--muted);white-space:nowrap;}
.sb-btn.on .sb-pct{background:#e0e3ff;color:var(--accent);}
.main{flex:1;overflow-y:auto;}
.content{padding:22px;max-width:980px;margin:0 auto;}
.panel{display:none;}
.panel.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 6px rgba(79,70,229,.06);}
.card-hd{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:14px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.fg input,.fg select,.fg textarea{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);background:var(--surface);transition:border-color .15s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.empty{text-align:center;padding:46px 20px;color:var(--muted);}
.empty .ico{font-size:42px;margin-bottom:10px;}
.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}

/* metric strip */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 6px rgba(79,70,229,.06);}
.metric .v{font-size:24px;font-weight:800;color:var(--accent);line-height:1;}
.metric .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;font-weight:600;}
.metric .sub{font-size:10.5px;color:var(--muted);margin-top:3px;}
.metric.warn .v{color:var(--amber);}
.metric.good .v{color:var(--green);}

/* phase breakdown bars */
.bars{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;}
.bar-name{width:165px;flex-shrink:0;display:flex;align-items:center;gap:7px;color:var(--text);font-weight:600;}
.bar-track{flex:1;background:var(--surface2);border-radius:99px;height:12px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width .4s;}
.bar-val{width:78px;text-align:right;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums;}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* task group */
.tg{margin-bottom:14px;}
.tg-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;color:#fff;}
.tg-hd .meta{font-weight:500;opacity:.92;font-size:11px;}
.task{display:grid;grid-template-columns:22px 1fr 86px 86px 118px 30px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--surface2);font-size:12.5px;}
.task:hover{background:var(--accentSoft);}
.task.done .t-title{text-decoration:line-through;color:var(--muted);}
.t-check{width:18px;height:18px;border:2px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.task.done .t-check{background:var(--green);border-color:var(--green);}
.t-title{font-weight:600;line-height:1.35;}
.t-title .note{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px;}
.t-num{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit;text-align:right;color:var(--text);background:#fff;}
.t-num:focus{outline:none;border-color:var(--accent);}
.t-num.actual{background:#fffdf5;}
.t-status{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:11px;font-family:inherit;background:#fff;cursor:pointer;}
.t-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px;border-radius:4px;}
.t-del:hover{color:var(--red);background:#fee2e2;}
.task-colhd{display:grid;grid-template-columns:22px 1fr 86px 86px 118px 30px;gap:8px;padding:4px 8px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.task-colhd span:nth-child(3),.task-colhd span:nth-child(4),.task-colhd span:nth-child(5){text-align:right;}
.st-todo{color:var(--slate);} .st-wip{color:var(--blue);} .st-blocked{color:var(--red);} .st-done{color:var(--green);}

/* tags */
.tagchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid transparent;}

/* add-task bar */
.addbar{display:grid;grid-template-columns:1.8fr 1.1fr 70px 1fr auto;gap:8px;align-items:center;background:var(--surface2);border:1px dashed var(--border);border-radius:9px;padding:10px;}
.addbar input,.addbar select{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--text);}
.addbar input:focus,.addbar select:focus{outline:none;border-color:var(--accent);}

/* library */
.lib-phase{margin-bottom:16px;}
.lib-phase-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:9px;color:#fff;font-weight:700;font-size:13px;margin-bottom:2px;}
.lib-phase-hd .right{display:flex;align-items:center;gap:10px;font-weight:500;font-size:11px;}
.lib-phase-hd a{color:#fff;text-decoration:underline;opacity:.9;}
.lib-task{display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border:1px solid var(--border);border-top:none;background:var(--surface);font-size:12.5px;}
.lib-task:first-of-type{border-top:1px solid var(--border);}
.lib-task:last-child{border-radius:0 0 9px 9px;}
.lib-cb{width:17px;height:17px;margin-top:2px;cursor:pointer;accent-color:var(--accent);flex-shrink:0;}
.lib-task .lt-body{flex:1;}
.lib-task .lt-title{font-weight:700;}
.lib-task .lt-desc{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45;}
.lib-est{font-size:11px;color:var(--accent);font-weight:700;background:var(--accentSoft);border:1px solid var(--border);border-radius:99px;padding:2px 9px;white-space:nowrap;flex-shrink:0;align-self:center;}

/* standup */
.su-person{margin-bottom:16px;}
.su-person-hd{font-size:13px;font-weight:800;color:var(--text);padding:6px 0;border-bottom:2px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.su-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:12.5px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface);}
.su-item .work{color:var(--muted);font-size:11px;}
.banner{background:var(--accentSoft);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--text);line-height:1.5;margin-bottom:16px;}
.banner b{color:var(--accent);}
.pill-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pill{padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);}
.pill:hover{border-color:var(--accent);color:var(--accent);}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr);}.g2,.g3{grid-template-columns:1fr;}.addbar{grid-template-columns:1fr 1fr;}.task,.task-colhd{grid-template-columns:20px 1fr 70px 92px;}.task .t-num.actual,.task-colhd span:nth-child(4),.task .t-status,.task-colhd span:nth-child(5),.task .t-del,.task-colhd span:nth-child(6){display:none;}}
@media print{.sb,.hdr-actions,.addbar,.t-del,.t-check,.pill-filter{display:none !important;}.app{display:block;}.main{overflow:visible;}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">🗂️</div>
  <div>
    <div class="hdr-title">SDLC Task Planner</div>
    <div class="hdr-sub">Standard task library · Hours &amp; estimates · Standup tagging</div>
  </div>
  <div class="hdr-actions">
    <a href="index.html" class="btn btn-ghost btn-sm" style="text-decoration:none;">&#8592; Hub</a>
    <button class="btn btn-ghost btn-sm" id="btnPrint">Print</button>
    <button class="btn btn-ghost btn-sm" id="btnExport">Export JSON</button>
    <button class="btn btn-ghost btn-sm" id="btnImport">Import</button>
  </div>
</div>
<div class="app">
  <div class="sb">
    <div class="sb-lbl">Work Items</div>
    <div id="sb-items"></div>
    <button class="sb-btn" data-nav="new"><span class="lbl">＋ New Work Item</span></button>
    <div class="sb-lbl">Team</div>
    <button class="sb-btn" data-nav="standup"><span class="lbl">🧍 Standup Board</span></button>
    <div class="sb-lbl">Reference</div>
    <button class="sb-btn" data-nav="library"><span class="lbl">📚 Standard Task Library</span></button>
  </div>
  <div class="main">
    <div class="content">

      <!-- Work Item detail -->
      <div class="panel" id="panel-item"><div id="item-content"></div></div>

      <!-- New work item -->
      <div class="panel on" id="panel-new">
        <div class="card">
          <div class="card-hd">Create Work Item</div>
          <div class="g3">
            <div class="fg"><label>Title / summary</label><input id="ni-name" placeholder="e.g. Add export-to-PDF on invoices"/></div>
            <div class="fg"><label>Ref / ticket</label><input id="ni-ref" placeholder="JIRA-1234"/></div>
            <div class="fg"><label>Assignee</label><input id="ni-owner" placeholder="e.g. Sira"/></div>
          </div>
          <div class="row">
            <button class="btn btn-primary" id="btnCreate">Create &amp; pick tasks</button>
            <span style="font-size:11.5px;color:var(--muted);align-self:center">Start blank, then pull tasks from the standard library or add custom ones.</span>
          </div>
        </div>
        <div class="card">
          <div class="card-hd">Recent Work Items</div>
          <div id="recent-list"></div>
        </div>
      </div>

      <!-- Standup board -->
      <div class="panel" id="panel-standup"><div id="standup-content"></div></div>

      <!-- Library -->
      <div class="panel" id="panel-library"><div id="library-content"></div></div>

    </div>
  </div>
</div>

<script>
/* ─────────── Reference model ─────────── */
const PHASES = [
  {key:'req',     name:'Requirements & Analysis', icon:'📋', color:'#2563eb', tool:{label:'Estimation Tool', href:'SoftwareEstimationTool.html'}},
  {key:'design',  name:'Design & Architecture',   icon:'🏗️', color:'#7c3aed', tool:{label:'System Design Assistant', href:'SystemDesignAssistant.html'}},
  {key:'dev',     name:'Development',              icon:'💻', color:'#0891b2', tool:{label:'Clean Arch Builder', href:'ddd-clean-architecture-builder.html'}},
  {key:'review',  name:'Code Review & Quality',   icon:'🔍', color:'#0d9488', tool:{label:'PR Review Audit', href:'pr-review-audit-tool.html'}},
  {key:'test',    name:'Testing & QA',            icon:'🧪', color:'#d97706', tool:{label:'Definition of Done', href:'DefinitionOfDone_Checklist.html'}},
  {key:'release', name:'Release & Deployment',    icon:'🚀', color:'#dc2626', tool:{label:'DORA Metrics', href:'DORA_Metrics_Dashboard.html'}},
  {key:'ops',     name:'Operations & Maintenance',icon:'⚙️', color:'#475569', tool:{label:'RCA Builder', href:'RCA_Report_Builder.html'}},
];
/* "Above-standard" tags raised during standup */
const EXTRA = [
  {key:'spike',   name:'Spike / Research', color:'#8b5cf6'},
  {key:'bug',     name:'Bug Fix',          color:'#dc2626'},
  {key:'rework',  name:'Rework',           color:'#ea580c'},
  {key:'debt',    name:'Tech Debt',        color:'#a16207'},
  {key:'support', name:'Support / Adhoc',  color:'#0891b2'},
  {key:'meeting', name:'Meeting / Ceremony',color:'#64748b'},
  {key:'other',   name:'Other',            color:'#475569'},
];
const GROUPS = {};
[...PHASES, ...EXTRA].forEach(g=>GROUPS[g.key]=g);
function gMeta(k){ return GROUPS[k] || {key:k,name:k,color:'#475569',icon:'🏷️'}; }

const LIBRARY = {
  req:[
    {t:'Review story / BRD',           d:'Read the requirement; understand business intent, scope and out-of-scope.', e:1},
    {t:'Clarify acceptance criteria',  d:'Confirm AC are complete and testable; raise open questions early.',         e:1},
    {t:'Identify dependencies & impact',d:'Upstream/downstream systems, shared data, other teams, sequencing.',        e:1},
    {t:'Break down & estimate',        d:'Decompose into tasks and size the effort with the team.',                   e:1},
  ],
  design:[
    {t:'Technical design (TDD)',       d:'Document the approach, components, sequence and trade-offs.',                e:4},
    {t:'Data model / schema design',   d:'Entities, tables, indexes, migration plan and constraints.',                e:3},
    {t:'API contract design',          d:'Endpoints, request/response shapes, status & error codes.',                 e:3},
    {t:'Architecture Decision Record', d:'Capture a significant decision, options considered and consequences.',      e:1},
    {t:'Design review',                d:'Walk peers / architect through the design and incorporate feedback.',       e:1},
  ],
  dev:[
    {t:'Branch & scaffolding',         d:'Create the branch, project structure and base configuration.',              e:1},
    {t:'Implement business logic',     d:'Core domain logic that satisfies the acceptance criteria.',                 e:8},
    {t:'Implement data access',        d:'Repositories, queries, persistence and transactions.',                      e:4},
    {t:'Implement API / endpoints',    d:'Controllers, validation, mapping and serialization.',                       e:4},
    {t:'Implement UI (if any)',        d:'Screens, components, state handling and wiring.',                            e:6},
    {t:'Error handling & edge cases',  d:'Validation, failure paths, retries and idempotency.',                       e:2},
    {t:'Logging & telemetry',          d:'Structured logs, metrics and tracing for observability.',                   e:2},
    {t:'Feature flag / config',        d:'Gate the change behind a flag for safe, configurable rollout.',             e:1},
    {t:'Unit tests',                   d:'Cover new logic, branches and edge conditions.',                            e:4},
  ],
  review:[
    {t:'Self-review & raise PR',       d:'Re-read the diff, write a clear description, attach evidence.',             e:1},
    {t:'Address review comments',      d:'Apply feedback, resolve threads and re-request review.',                    e:2},
    {t:'Static analysis / lint fixes', d:'Resolve analyzer, security and code-style warnings.',                       e:1},
  ],
  test:[
    {t:'Write test cases',             d:'Scenarios from AC including negative and boundary paths.',                  e:2},
    {t:'Integration tests',            d:'Cross-component and API-level automated tests.',                            e:3},
    {t:'Manual / exploratory testing', d:'Verify behaviour and UX beyond the scripted cases.',                       e:2},
    {t:'Regression testing',           d:'Confirm existing functionality is unaffected.',                            e:2},
    {t:'Bug fixing',                   d:'Fix defects found during testing and re-verify.',                           e:4},
    {t:'UAT support',                  d:'Support business verification and sign-off.',                               e:2},
  ],
  release:[
    {t:'DB migration scripts',         d:'Author and test forward migration plus rollback.',                          e:2},
    {t:'Deploy to staging',            d:'Run the pipeline; verify config and secrets.',                              e:1},
    {t:'Smoke test on staging',        d:'Sanity-check the critical paths before promotion.',                         e:1},
    {t:'Release notes / changelog',    d:'Summarize changes, impacts and rollback steps.',                            e:1},
    {t:'Deploy to production',         d:'Execute the release and monitor during rollout.',                           e:1},
    {t:'Post-deploy verification',     d:'Validate production health and key signals.',                               e:1},
  ],
  ops:[
    {t:'Monitoring & alerts',          d:'Dashboards and alert thresholds for the new behaviour.',                    e:2},
    {t:'Documentation update',         d:'Runbook, README and wiki kept current.',                                    e:2},
    {t:'Incident / production support',d:'Investigate and resolve issues raised in production.',                      e:4},
    {t:'Tech debt / refactor',         d:'Improve structure and pay down accumulated debt.',                          e:4},
  ],
};

/* ─────────── State ─────────── */
const SK='sdlc-task-planner-v1';
let S = (()=>{ try{const d=localStorage.getItem(SK); if(d) return JSON.parse(d);}catch{} return {items:[],nid:1}; })();
let activePanel='new', currentItem=null, suFilter='active';
function save(){ localStorage.setItem(SK, JSON.stringify(S)); }
function uid(){ return 'id'+(S.nid++); }
function today(){ return new Date().toISOString().split('T')[0]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

/* ─────────── Computations ─────────── */
function itemStats(it){
  let est=0,act=0,done=0,rem=0;
  it.tasks.forEach(t=>{ est+=num(t.est); act+=num(t.actual); if(t.status==='done'){done++;} else {rem+=num(t.est);} });
  const total=it.tasks.length;
  const pct = total? Math.round(done/total*100):0;
  return {est,act,done,rem,total,pct};
}

/* ─────────── Navigation ─────────── */
function nav(p, id){
  activePanel=p; currentItem = (p==='item')? id : currentItem;
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.sb-btn').forEach(el=>el.classList.remove('on'));
  document.getElementById('panel-'+p).classList.add('on');
  const nb=document.querySelector(`.sb-btn[data-nav="${p}"]`); if(nb) nb.classList.add('on');
  if(p==='item') renderItem(id);
  if(p==='new') renderRecent();
  if(p==='library') renderLibrary();
  if(p==='standup') renderStandup();
  renderSB();
}

/* ─────────── Sidebar ─────────── */
function renderSB(){
  const sorted=[...S.items].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  document.getElementById('sb-items').innerHTML = sorted.length? sorted.map(it=>{
    const st=itemStats(it);
    return `<button class="sb-btn${currentItem===it.id&&activePanel==='item'?' on':''}" data-nav="item" data-id="${it.id}">
      <span class="lbl"><span class="nm">${st.pct===100?'✅ ':''}${esc(it.name)}</span></span>
      <span class="sb-pct">${st.est}h</span>
    </button>`;
  }).join('') : '<div style="padding:8px 14px;font-size:12px;color:var(--muted)">No work items yet</div>';
}

/* ─────────── New / Recent ─────────── */
function renderRecent(){
  const sorted=[...S.items].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  document.getElementById('recent-list').innerHTML = sorted.length? sorted.slice(0,8).map(it=>{
    const st=itemStats(it);
    return `<div class="su-item" data-nav="item" data-id="${it.id}" style="cursor:pointer">
      <div style="flex:1">
        <div style="font-weight:700">${esc(it.name)}</div>
        <div class="work">${it.ref?esc(it.ref)+' · ':''}${it.owner?esc(it.owner)+' · ':''}${st.total} tasks · ${st.est}h est${st.act?` · ${st.act}h actual`:''}</div>
      </div>
      <span class="sb-pct">${st.pct}%</span>
    </div>`;
  }).join('') : '<div class="empty"><div class="ico">🗂️</div><div class="big">No work items yet</div><div>Create one above to start planning tasks.</div></div>';
}

/* ─────────── Work Item detail ─────────── */
const STATUSES=[['todo','To Do'],['wip','In Progress'],['blocked','Blocked'],['done','Done']];
function renderItem(id){
  const it=S.items.find(x=>x.id===id);
  const box=document.getElementById('item-content');
  if(!it){ box.innerHTML='<div class="empty"><div class="ico">🗂️</div><div class="big">Work item not found</div></div>'; return; }
  const st=itemStats(it);

  // group tasks
  const order=[...PHASES.map(p=>p.key),...EXTRA.map(e=>e.key)];
  const byGroup={};
  it.tasks.forEach(t=>{ (byGroup[t.group]=byGroup[t.group]||[]).push(t); });

  let html=`<div class="card">
    <div class="card-hd">${esc(it.name)}
      <div style="display:flex;gap:6px">
        <button class="btn btn-soft btn-sm" data-act="rename" data-id="${it.id}">Rename</button>
        <button class="btn btn-danger btn-sm" data-act="delItem" data-id="${it.id}">Delete</button>
      </div>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:-8px;margin-bottom:4px">
      ${it.ref?'<b>'+esc(it.ref)+'</b> · ':''}${it.owner?'👤 '+esc(it.owner)+' · ':''}created ${it.createdAt}
    </div>
  </div>`;

  // metrics
  html+=`<div class="metrics">
    <div class="metric"><div class="v">${st.est}</div><div class="k">Estimated hrs</div><div class="sub">${st.total} tasks</div></div>
    <div class="metric ${st.act>st.est?'warn':''}"><div class="v">${st.act}</div><div class="k">Actual hrs</div><div class="sub">${st.act>st.est?'+':''}${(st.act-st.est).toFixed(1)} vs est</div></div>
    <div class="metric"><div class="v">${st.rem.toFixed(1)}</div><div class="k">Remaining est</div><div class="sub">${st.total-st.done} open tasks</div></div>
    <div class="metric ${st.pct===100?'good':''}"><div class="v">${st.pct}%</div><div class="k">Complete</div><div class="sub">${st.done}/${st.total} done</div></div>
  </div>`;

  // breakdown bars
  const maxEst=Math.max(1,...order.map(k=>(byGroup[k]||[]).reduce((s,t)=>s+num(t.est),0)));
  const barRows=order.filter(k=>byGroup[k]).map(k=>{
    const g=gMeta(k); const e=(byGroup[k]).reduce((s,t)=>s+num(t.est),0); const a=(byGroup[k]).reduce((s,t)=>s+num(t.actual),0);
    return `<div class="bar-row"><div class="bar-name"><span class="dot" style="background:${g.color}"></span>${g.icon?g.icon+' ':''}${esc(g.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(e/maxEst*100)}%;background:${g.color}"></div></div>
      <div class="bar-val">${e}h${a?` / ${a}h`:''}</div></div>`;
  }).join('');
  if(barRows) html+=`<div class="card"><div class="card-hd">Effort by Phase &amp; Tag</div><div class="bars">${barRows}</div></div>`;

  // task groups
  html+=`<div class="card"><div class="card-hd">Tasks</div>`;
  if(!it.tasks.length){
    html+='<div class="empty" style="padding:24px"><div class="ico">📝</div><div class="big">No tasks yet</div><div>Add custom tasks below, or pull from the Standard Task Library.</div></div>';
  } else {
    html+=`<div class="task-colhd"><span></span><span>Task</span><span>Est h</span><span>Act h</span><span>Status</span><span></span></div>`;
    order.filter(k=>byGroup[k]).forEach(k=>{
      const g=gMeta(k); const rows=byGroup[k];
      const ge=rows.reduce((s,t)=>s+num(t.est),0), ga=rows.reduce((s,t)=>s+num(t.actual),0);
      html+=`<div class="tg"><div class="tg-hd" style="background:${g.color}"><span>${g.icon?g.icon+' ':'🏷️ '}${esc(g.name)}</span><span class="meta">${rows.length} task${rows.length>1?'s':''} · ${ge}h est${ga?` · ${ga}h act`:''}</span></div>`;
      rows.forEach(t=>{
        html+=`<div class="task${t.status==='done'?' done':''}" data-id="${t.id}">
          <div class="t-check" data-act="toggle" data-id="${t.id}">${t.status==='done'?'<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,5 4,8 10,1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
          <div class="t-title">${esc(t.title)}${t.note?`<span class="note">${esc(t.note)}</span>`:''}</div>
          <input class="t-num" type="number" min="0" step="0.5" value="${t.est||''}" data-field="est" data-id="${t.id}" placeholder="0"/>
          <input class="t-num actual" type="number" min="0" step="0.5" value="${t.actual||''}" data-field="actual" data-id="${t.id}" placeholder="0"/>
          <select class="t-status st-${t.status}" data-field="status" data-id="${t.id}">${STATUSES.map(s=>`<option value="${s[0]}"${t.status===s[0]?' selected':''}>${s[1]}</option>`).join('')}</select>
          <button class="t-del" data-act="delTask" data-id="${t.id}" title="Remove">✕</button>
        </div>`;
      });
      html+=`</div>`;
    });
  }
  html+=`</div>`;

  // add task bar (standup quick-add)
  const groupOpts = `<optgroup label="SDLC phase">${PHASES.map(p=>`<option value="${p.key}">${p.icon} ${esc(p.name)}</option>`).join('')}</optgroup>`+
                    `<optgroup label="Above-standard tag">${EXTRA.map(e=>`<option value="${e.key}">🏷️ ${esc(e.name)}</option>`).join('')}</optgroup>`;
  html+=`<div class="card">
    <div class="card-hd">Quick Add Task <span style="font-weight:500;text-transform:none;color:var(--muted);font-size:11px">Use in standup to log spikes, bugs, rework &amp; other above-standard work</span></div>
    <div class="addbar">
      <input id="qa-title" placeholder="Task title…"/>
      <select id="qa-group">${groupOpts}</select>
      <input id="qa-est" type="number" min="0" step="0.5" placeholder="hrs"/>
      <input id="qa-note" placeholder="note (optional)"/>
      <button class="btn btn-primary btn-sm" id="btnQuickAdd">＋ Add</button>
    </div>
    <div style="margin-top:10px"><button class="btn btn-soft btn-sm" data-nav="library">📚 Add from Standard Task Library</button></div>
  </div>`;

  box.innerHTML=html;
}

/* ─────────── Library ─────────── */
function renderLibrary(){
  const inItem = currentItem && S.items.find(x=>x.id===currentItem);
  let html=`<div class="banner">📚 <b>Standard SDLC Task Library</b> — the reference set of tasks every assigned item typically passes through.
    ${inItem? `Tick tasks and click <b>Add selected</b> to attach them to <b>${esc(inItem.name)}</b>.`
            : `Open or create a work item first, then come back here to attach tasks. You can still browse the reference now.`}</div>`;
  if(inItem){
    html+=`<div style="display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0">
      <button class="btn btn-primary btn-sm" id="btnAddSelected">＋ Add selected to “${esc(inItem.name)}”</button>
      <button class="btn btn-soft btn-sm" data-nav="item" data-id="${inItem.id}">← Back to work item</button>
    </div>`;
  }
  PHASES.forEach(p=>{
    html+=`<div class="lib-phase">
      <div class="lib-phase-hd" style="background:${p.color}">
        <span>${p.icon} ${esc(p.name)}</span>
        <span class="right"><span>${LIBRARY[p.key].length} tasks</span><a href="${p.tool.href}">🔧 ${esc(p.tool.label)}</a></span>
      </div>`;
    LIBRARY[p.key].forEach((t,i)=>{
      html+=`<label class="lib-task">
        ${inItem?`<input class="lib-cb" type="checkbox" data-phase="${p.key}" data-idx="${i}">`:''}
        <div class="lt-body"><div class="lt-title">${esc(t.t)}</div><div class="lt-desc">${esc(t.d)}</div></div>
        <span class="lib-est">${t.e}h typical</span>
      </label>`;
    });
    html+=`</div>`;
  });
  document.getElementById('library-content').innerHTML=html;
}

/* ─────────── Standup board ─────────── */
function renderStandup(){
  const box=document.getElementById('standup-content');
  if(!S.items.length){ box.innerHTML='<div class="empty"><div class="ico">🧍</div><div class="big">Nothing to stand up about yet</div><div>Create a work item and add tasks first.</div></div>'; return; }
  // gather tasks
  const rows=[];
  S.items.forEach(it=> it.tasks.forEach(t=> rows.push({it,t})));
  const filt = rows.filter(({t})=>{
    if(suFilter==='active') return t.status==='wip'||t.status==='blocked';
    if(suFilter==='blocked') return t.status==='blocked';
    if(suFilter==='open') return t.status!=='done';
    return true;
  });
  // group by owner
  const byOwner={};
  filt.forEach(r=>{ const o=r.it.owner||'Unassigned'; (byOwner[o]=byOwner[o]||[]).push(r); });

  let html=`<div class="banner">🧍 <b>Standup Board</b> — what each person has in flight across all work items. Add new spikes, bugs or rework on the work item itself, then they show up here.</div>`;
  html+=`<div class="pill-filter">
    ${[['active','In progress + blocked'],['blocked','Blocked only'],['open','All open'],['all','Everything']].map(f=>`<span class="pill${suFilter===f[0]?' on':''}" data-su="${f[0]}">${f[1]}</span>`).join('')}
  </div>`;
  const owners=Object.keys(byOwner).sort();
  if(!owners.length){ html+='<div class="empty"><div class="ico">✅</div><div class="big">Nothing matches this filter</div></div>'; }
  owners.forEach(o=>{
    const list=byOwner[o];
    const hrs=list.reduce((s,r)=>s+num(r.t.est),0);
    html+=`<div class="su-person"><div class="su-person-hd">👤 ${esc(o)} <span style="font-weight:500;color:var(--muted);font-size:11px">${list.length} task${list.length>1?'s':''} · ${hrs}h</span></div>`;
    list.forEach(({it,t})=>{
      const g=gMeta(t.group);
      const stLbl=(STATUSES.find(s=>s[0]===t.status)||['','?'])[1];
      html+=`<div class="su-item" data-nav="item" data-id="${it.id}" style="cursor:pointer">
        <span class="tagchip" style="background:${g.color}1a;color:${g.color};border-color:${g.color}40">${g.icon||'🏷️'} ${esc(g.name)}</span>
        <span style="flex:1">${esc(t.title)} <span class="work">— ${esc(it.name)}${it.ref?' ('+esc(it.ref)+')':''}</span></span>
        <span class="tagchip st-${t.status}" style="background:var(--surface2)">${stLbl}</span>
        <span class="sb-pct">${num(t.est)}h</span>
      </div>`;
    });
    html+=`</div>`;
  });
  box.innerHTML=html;
}

/* ─────────── Mutations ─────────── */
function createItem(){
  const name=document.getElementById('ni-name').value.trim();
  if(!name){ alert('Title required'); return; }
  const it={ id:uid(), name, ref:document.getElementById('ni-ref').value.trim(), owner:document.getElementById('ni-owner').value.trim(), createdAt:today(), tasks:[] };
  S.items.push(it); save();
  document.getElementById('ni-name').value=''; document.getElementById('ni-ref').value=''; document.getElementById('ni-owner').value='';
  nav('item', it.id);
}
function curItem(){ return S.items.find(x=>x.id===currentItem); }
function findTask(id){ for(const it of S.items){ const t=it.tasks.find(t=>t.id===id); if(t) return {it,t}; } return {}; }

function quickAdd(){
  const it=curItem(); if(!it) return;
  const title=document.getElementById('qa-title').value.trim();
  if(!title){ document.getElementById('qa-title').focus(); return; }
  it.tasks.push({ id:uid(), title, group:document.getElementById('qa-group').value, est:num(document.getElementById('qa-est').value), actual:0, status:'todo', note:document.getElementById('qa-note').value.trim() });
  save();
  renderItem(it.id);
  setTimeout(()=>{ const e=document.getElementById('qa-title'); if(e) e.focus(); },0);
}
function addSelected(){
  const it=curItem(); if(!it) return;
  const boxes=[...document.querySelectorAll('.lib-cb:checked')];
  if(!boxes.length){ alert('Tick at least one task'); return; }
  boxes.forEach(cb=>{ const ph=cb.dataset.phase, idx=+cb.dataset.idx; const src=LIBRARY[ph][idx];
    it.tasks.push({ id:uid(), title:src.t, group:ph, est:src.e, actual:0, status:'todo', note:'' }); });
  save(); nav('item', it.id);
}
function updTask(id,field,val){
  const {t}=findTask(id); if(!t) return;
  if(field==='est'||field==='actual') t[field]=num(val);
  else t[field]=val;
  save();
}

/* ─────────── Events (delegation) ─────────── */
document.addEventListener('click', e=>{
  const navEl=e.target.closest('[data-nav]');
  if(navEl){ nav(navEl.dataset.nav, navEl.dataset.id); return; }
  const su=e.target.closest('[data-su]'); if(su){ suFilter=su.dataset.su; renderStandup(); return; }
  const act=e.target.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act, id=act.dataset.id;
  if(a==='toggle'){ const {t}=findTask(id); if(t){ t.status = t.status==='done'?'todo':'done'; save(); renderItem(currentItem); } }
  if(a==='delTask'){ const it=curItem(); if(it){ it.tasks=it.tasks.filter(x=>x.id!==id); save(); renderItem(it.id); } }
  if(a==='delItem'){ if(confirm('Delete this work item and its tasks?')){ S.items=S.items.filter(x=>x.id!==id); currentItem=null; save(); nav('new'); } }
  if(a==='rename'){ const it=S.items.find(x=>x.id===id); if(it){ const n=prompt('Title:',it.name); if(n&&n.trim()){ it.name=n.trim(); save(); renderItem(it.id); } } }
});
document.addEventListener('change', e=>{
  const f=e.target.closest('[data-field]'); if(!f) return;
  updTask(f.dataset.id, f.dataset.field, f.value);
  if(f.dataset.field==='status'){ f.className='t-status st-'+f.value; const row=f.closest('.task'); if(row) row.classList.toggle('done', f.value==='done'); renderItem(currentItem); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.closest('.addbar')){ e.preventDefault(); quickAdd(); }
});

/* static buttons */
document.getElementById('btnCreate').addEventListener('click', createItem);
document.getElementById('btnPrint').addEventListener('click', ()=>window.print());
document.getElementById('btnExport').addEventListener('click', ()=>{
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='sdlc-tasks.json'; a.click();
});
document.getElementById('btnImport').addEventListener('click', ()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=ev=>{ const fr=new FileReader(); fr.onload=x=>{ try{ const d=JSON.parse(x.target.result); if(!d.items) throw 0; S=d; save(); nav('new'); }catch{ alert('Invalid file'); } }; fr.readAsText(ev.target.files[0]); };
  inp.click();
});
/* dynamic-area buttons via delegation */
document.addEventListener('click', e=>{
  if(e.target.id==='btnQuickAdd') quickAdd();
  if(e.target.id==='btnAddSelected') addSelected();
});

/* init */
renderSB(); renderRecent();
</script>
</body>
</html>
