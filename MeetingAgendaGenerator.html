<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Agenda Generator — QuickTools</title>
<style>
:root{
  --bg:#f0f4ff;--surface:#fff;--surface2:#f5f7ff;--border:#dde3f5;
  --accent:#4f46e5;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626;
  --text:#1e293b;--muted:#64748b;--radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:14px;}

.hdr{background:linear-gradient(135deg,#1e40af,#4f46e5);padding:13px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 2px 14px rgba(79,70,229,.25);}
.hdr-icon{width:40px;height:40px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.hdr-title{font-size:17px;font-weight:700;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px;}

.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .17s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.26);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#4338ca;}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-purple{background:var(--accent2);color:#fff;}
.btn-purple:hover{background:#6d28d9;}
.btn-outline{background:#fff;color:var(--muted);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-del{background:#fff;color:var(--red);border:1px solid #fecaca;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;}
.btn-del:hover{background:#fef2f2;}
.btn-sm{padding:4px 10px;font-size:11px;}

.app{flex:1;display:flex;overflow:hidden;}
.left{width:430px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:16px 18px;}
.right{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.right-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.right-hdr h3{font-size:13px;font-weight:700;}
.right-hdr p{font-size:11px;color:var(--muted);}
.right-body{flex:1;overflow-y:auto;padding:20px;}

.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px rgba(79,70,229,.05);}
.sec-hd{padding:10px 14px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);border-bottom:1px solid var(--border);background:rgba(79,70,229,.04);display:flex;align-items:center;justify-content:space-between;}
.sec-body{padding:14px;}

.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fg:last-child{margin-bottom:0;}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.fg input,.fg select,.fg textarea{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);font-family:inherit;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
.fg textarea{resize:vertical;min-height:60px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.opt-chip{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;user-select:none;transition:all .15s;}
.opt-chip:hover{border-color:#a5b4fc;background:#eef2ff;}
.opt-chip.on{border-color:#a5b4fc;background:#eef2ff;}
.opt-chip input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0;}
.opt-chip .clbl{font-size:12px;font-weight:500;color:var(--muted);}
.opt-chip.on .clbl{color:var(--accent);font-weight:600;}

.p-row{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;}
.p-row input{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;flex:1;padding:0;outline:none;}
.p-row input::placeholder{color:#bbb;}
.p-sep{color:var(--border);}
.p-empty{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;}

.ag-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:7px;}
.ag-item.off{opacity:.42;}
.ag-hd{display:flex;align-items:center;gap:7px;padding:9px 11px;}
.ag-hd input[type=checkbox]{accent-color:var(--green);width:13px;height:13px;cursor:pointer;flex-shrink:0;}
.ag-num{font-size:10px;font-weight:700;color:var(--muted);min-width:18px;text-align:right;}
.ag-ttl{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;outline:none;}
.ag-ttl::placeholder{color:#bbb;font-weight:400;}
.ag-mw{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.ag-mi{width:44px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:3px 5px;color:var(--text);font-size:12px;text-align:center;outline:none;font-family:inherit;}
.ag-mi:focus{border-color:var(--accent);}
.ag-ml{font-size:11px;color:var(--muted);}
.ord{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.ord button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:9px;padding:1px 3px;line-height:1;}
.ord button:hover{color:var(--accent);}
.ord button:disabled{opacity:.22;cursor:default;}
.ag-nb{background:none;border:1px solid transparent;border-radius:4px;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 6px;white-space:nowrap;transition:all .15s;}
.ag-nb:hover{color:var(--accent2);border-color:#ddd6fe;background:#f5f3ff;}
.ag-bd{padding:0 11px 11px;border-top:1px solid var(--border);}
.ag-bd label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin:10px 0 4px;}
.ag-bd textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12.5px;color:var(--text);font-family:inherit;resize:vertical;min-height:68px;transition:border-color .15s;}
.ag-bd textarea:focus{outline:none;border-color:var(--accent2);}

.tbar{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-top:10px;}
.tbar-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:7px;}
.tbar-lbl{color:var(--muted);font-weight:600;}
.tbar-val{font-weight:700;font-size:12px;}
.c-ok{color:#16a34a;}.c-ov{color:#dc2626;}.c-un{color:#d97706;}
.tbar-track{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.tbar-fill{height:100%;border-radius:99px;transition:width .3s;}
.tbar-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.tbar-chip{font-size:10px;padding:2px 7px;border-radius:99px;background:#e0e7ff;color:var(--accent);font-weight:500;}

.prv-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 6px rgba(79,70,229,.06);}
.prv-inner{padding:28px 32px;line-height:1.65;}
.prv-title{font-size:21px;font-weight:800;color:var(--accent);margin-bottom:5px;}
.prv-meta{font-size:12.5px;color:var(--muted);margin-bottom:22px;line-height:2;}
.prv-sec{margin-bottom:22px;}
.prv-sec-hd{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);padding-bottom:7px;margin-bottom:13px;border-bottom:2px solid var(--border);}
.prv-chips{display:flex;flex-wrap:wrap;gap:5px;}
.prv-chip{display:inline-flex;align-items:center;gap:5px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:99px;padding:4px 12px;font-size:12px;}
.prv-chip .rl{color:var(--muted);font-size:11px;}
.prv-ag{display:flex;gap:11px;margin-bottom:13px;}
.prv-ag-n{min-width:24px;height:24px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#1d4ed8;flex-shrink:0;margin-top:2px;}
.prv-ag-b{flex:1;}
.prv-ag-t{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.prv-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:600;flex-shrink:0;}
.prv-pts{margin-top:5px;list-style:none;padding:0;}
.prv-pts li{font-size:12.5px;color:var(--muted);padding:2px 0 2px 14px;position:relative;line-height:1.5;}
.prv-pts li::before{content:'\2022';position:absolute;left:0;color:#a78bfa;}
.prv-bk{border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-top:4px;}
.prv-br{display:flex;justify-content:space-between;padding:7px 13px;border-bottom:1px solid #f1f5f9;font-size:12.5px;}
.prv-br:last-child{border-bottom:none;}
.prv-br.tot{background:#eff6ff;font-weight:700;color:#1d4ed8;}
.prv-br .v{color:var(--muted);font-weight:600;}
.prv-br.tot .v{color:#1d4ed8;}
.prv-empty{text-align:center;padding:52px 24px;color:var(--muted);}
.prv-empty .ico{font-size:38px;margin-bottom:12px;}
.prv-empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}

.toast{position:fixed;bottom:22px;right:22px;background:#16a34a;color:#fff;padding:10px 17px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.2);transform:translateY(70px);opacity:0;transition:all .28s;z-index:1000;}
.toast.show{transform:translateY(0);opacity:1;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

@media(max-width:860px){
  .app{flex-direction:column;overflow:auto;height:auto;}
  body{height:auto;overflow:auto;}
  .left{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .right{min-height:500px;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-icon">&#128197;</div>
  <div>
    <div class="hdr-title">Meeting Agenda Generator</div>
    <div class="hdr-sub">Structured agenda with talking points &amp; time breakdown &#8212; ready to email</div>
  </div>
  <div style="margin-left:auto;">
    <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">&#8592; Home</a>
  </div>
</header>

<div class="app">

  <div class="left">

    <div class="sec">
      <div class="sec-hd">Meeting Details</div>
      <div class="sec-body">
        <div class="fg">
          <label>Meeting Title *</label>
          <input id="fTitle" placeholder="e.g. Sprint 12 Planning" oninput="render()">
        </div>
        <div class="g2">
          <div class="fg">
            <label>Meeting Type</label>
            <select id="fType" onchange="render()">
              <option>Sprint Planning</option><option>Sprint Review</option>
              <option>Sprint Retrospective</option><option>Daily Standup</option>
              <option>Architecture Review</option><option>Design Session</option>
              <option>Stakeholder Update</option><option>1-on-1</option>
              <option>Kick-off</option><option>Post-mortem / RCA</option>
              <option>Workshop</option><option>All Hands</option><option>Ad-hoc</option>
            </select>
          </div>
          <div class="fg">
            <label>Total Duration</label>
            <select id="fDur" onchange="renderTbar();render()">
              <option value="15">15 min</option><option value="30">30 min</option>
              <option value="45">45 min</option><option value="60" selected>1 hour</option>
              <option value="90">90 min</option><option value="120">2 hours</option>
              <option value="180">3 hours</option><option value="240">4 hours</option>
              <option value="480">Full day</option>
            </select>
          </div>
        </div>
        <div class="g2">
          <div class="fg"><label>Date</label><input type="date" id="fDate" oninput="render()"></div>
          <div class="fg"><label>Time</label><input type="time" id="fTime" oninput="render()"></div>
        </div>
        <div class="g2">
          <div class="fg"><label>Location / Link</label><input id="fLoc" placeholder="Teams, Zoom, Room A&#8230;" oninput="render()"></div>
          <div class="fg"><label>Facilitator</label><input id="fFac" placeholder="Name" oninput="render()"></div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd">Output Options</div>
      <div class="sec-body">
        <div class="opt-grid">
          <label class="opt-chip on" id="lbl-oDate"><input type="checkbox" id="oDate" checked onchange="tog('oDate')"><span class="clbl">Date &amp; Time</span></label>
          <label class="opt-chip on" id="lbl-oLoc"><input type="checkbox" id="oLoc" checked onchange="tog('oLoc')"><span class="clbl">Location</span></label>
          <label class="opt-chip on" id="lbl-oFac"><input type="checkbox" id="oFac" checked onchange="tog('oFac')"><span class="clbl">Facilitator</span></label>
          <label class="opt-chip on" id="lbl-oType"><input type="checkbox" id="oType" checked onchange="tog('oType')"><span class="clbl">Meeting Type</span></label>
          <label class="opt-chip on" id="lbl-oPpl"><input type="checkbox" id="oPpl" checked onchange="tog('oPpl')"><span class="clbl">Participants</span></label>
          <label class="opt-chip on" id="lbl-oPts"><input type="checkbox" id="oPts" checked onchange="tog('oPts')"><span class="clbl">Talking Points</span></label>
          <label class="opt-chip on" id="lbl-oMin"><input type="checkbox" id="oMin" checked onchange="tog('oMin')"><span class="clbl">Time per Item</span></label>
          <label class="opt-chip on" id="lbl-oBk"><input type="checkbox" id="oBk" checked onchange="tog('oBk')"><span class="clbl">Time Breakdown</span></label>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd">Participants <button class="btn btn-primary btn-sm" onclick="addP()">+ Add</button></div>
      <div class="sec-body" id="pList"><p class="p-empty">Click <strong>+ Add</strong> to add participants.</p></div>
    </div>

    <div class="sec">
      <div class="sec-hd">Agenda Items <button class="btn btn-primary btn-sm" onclick="addA()">+ Add Item</button></div>
      <div class="sec-body">
        <div id="agList"></div>
        <div class="tbar" id="tbar"></div>
      </div>
    </div>

  </div>

  <div class="right">
    <div class="right-hdr">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:15px;">&#128065;</span>
        <div><h3>Live Preview</h3><p>Updates as you type &#8212; copy or export when ready</p></div>
      </div>
      <div style="display:flex;gap:7px;">
        <button class="btn btn-outline btn-sm" onclick="cpText()">&#128203; Copy Text</button>
        <button class="btn btn-purple btn-sm" onclick="cpRich()">&#10024; Copy Rich</button>
        <button class="btn btn-success btn-sm" onclick="expHTML()">&#8595; Export HTML</button>
      </div>
    </div>
    <div class="right-body">
      <div class="prv-box"><div class="prv-inner" id="prv"></div></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var seq = 1;
var OPT = {oDate:1, oLoc:1, oFac:1, oType:1, oPpl:1, oPts:1, oMin:1, oBk:1};
var peeps = [];
var agenda = [];

function el(id) { return document.getElementById(id); }
function val(id) { var e = el(id); return (e && e.value) ? e.value : ''; }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function tog(k) {
  OPT[k] = el(k).checked ? 1 : 0;
  el('lbl-' + k).classList.toggle('on', !!OPT[k]);
  render();
}

/* PARTICIPANTS */
function addP() {
  peeps.push({id: seq++, name: '', role: ''});
  drawP();
  render();
}
function rmP(id) {
  peeps = peeps.filter(function(x){ return x.id !== id; });
  drawP();
  render();
}
function setP(id, k, v) {
  var p = peeps.filter(function(x){ return x.id === id; })[0];
  if (p) { p[k] = v; render(); }
}
function drawP() {
  var box = el('pList');
  if (!peeps.length) {
    box.innerHTML = '<p class="p-empty">Click <strong>+ Add</strong> to add participants.</p>';
    return;
  }
  var html = '';
  for (var i = 0; i < peeps.length; i++) {
    var p = peeps[i];
    html += '<div class="p-row">';
    html += '<span style="font-size:13px;color:var(--muted)">&#128100;</span>';
    html += '<input placeholder="Full name" value="' + esc(p.name) + '" oninput="setP(' + p.id + ',\'name\',this.value)" style="flex:2">';
    html += '<span class="p-sep">|</span>';
    html += '<input placeholder="Role / Title" value="' + esc(p.role) + '" oninput="setP(' + p.id + ',\'role\',this.value)" style="flex:1.4">';
    html += '<button class="btn-del" onclick="rmP(' + p.id + ')">&#10005;</button>';
    html += '</div>';
  }
  box.innerHTML = html;
}

/* AGENDA */
function addA() {
  agenda.push({id: seq++, title: '', mins: 15, pts: '', on: true, open: false});
  drawA();
  render();
}
function rmA(id) {
  agenda = agenda.filter(function(x){ return x.id !== id; });
  drawA();
  render();
}
function togA(id) {
  var a = agenda.filter(function(x){ return x.id === id; })[0];
  if (a) { a.on = !a.on; drawA(); render(); }
}
function togOpen(id) {
  var a = agenda.filter(function(x){ return x.id === id; })[0];
  if (a) { a.open = !a.open; drawA(); }
}
function mvA(id, d) {
  var i = -1;
  for (var j = 0; j < agenda.length; j++) { if (agenda[j].id === id) { i = j; break; } }
  if (i < 0) return;
  var ni = i + d;
  if (ni < 0 || ni >= agenda.length) return;
  var tmp = agenda[i]; agenda[i] = agenda[ni]; agenda[ni] = tmp;
  drawA();
  render();
}
function setA(id, k, v) {
  var a = agenda.filter(function(x){ return x.id === id; })[0];
  if (a) {
    a[k] = v;
    if (k === 'mins') renderTbar();
    render();
  }
}

function drawA() {
  var box = el('agList');
  if (!agenda.length) { box.innerHTML = ''; renderTbar(); return; }
  var html = '';
  for (var i = 0; i < agenda.length; i++) {
    var a = agenda[i];
    html += '<div class="ag-item' + (a.on ? '' : ' off') + '">';
    html += '<div class="ag-hd">';
    html += '<input type="checkbox" ' + (a.on ? 'checked' : '') + ' onchange="togA(' + a.id + ')">';
    html += '<span class="ag-num">' + (i + 1) + '.</span>';
    html += '<input class="ag-ttl" placeholder="Agenda item title…" value="' + esc(a.title) + '" oninput="setA(' + a.id + ',\'title\',this.value)">';
    html += '<div class="ag-mw">';
    html += '<input class="ag-mi" type="number" min="0" max="480" value="' + a.mins + '" oninput="setA(' + a.id + ',\'mins\',parseInt(this.value)||0)">';
    html += '<span class="ag-ml">min</span>';
    html += '</div>';
    html += '<div class="ord">';
    html += '<button onclick="mvA(' + a.id + ',-1)" ' + (i === 0 ? 'disabled' : '') + '>&#9650;</button>';
    html += '<button onclick="mvA(' + a.id + ',1)" ' + (i === agenda.length - 1 ? 'disabled' : '') + '>&#9660;</button>';
    html += '</div>';
    html += '<button class="ag-nb" onclick="togOpen(' + a.id + ')">' + (a.open ? '&#9662; Hide' : '&#9658; Notes') + '</button>';
    html += '<button class="btn-del" onclick="rmA(' + a.id + ')">&#10005;</button>';
    html += '</div>';
    if (a.open) {
      html += '<div class="ag-bd">';
      html += '<label>Talking Points</label>';
      html += '<textarea placeholder="&#8226; Discussion point&#10;&#8226; Question to address&#10;&#8226; Decision needed" oninput="setA(' + a.id + ',\'pts\',this.value)">' + esc(a.pts) + '</textarea>';
      html += '</div>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
  renderTbar();
}

function renderTbar() {
  var box = el('tbar');
  var total = parseInt(val('fDur')) || 60;
  var act = agenda.filter(function(a){ return a.on; });
  var used = 0;
  for (var i = 0; i < act.length; i++) used += parseInt(act[i].mins) || 0;
  var pct = Math.min(used / total * 100, 100);
  var col, cls, msg;
  if (used === total) { col = '#16a34a'; cls = 'c-ok'; msg = 'Perfect fit'; }
  else if (used > total) { col = '#dc2626'; cls = 'c-ov'; msg = 'Over by ' + (used - total) + 'm'; }
  else { col = '#d97706'; cls = 'c-un'; msg = (total - used) + 'm remaining'; }
  var chips = '';
  for (var j = 0; j < act.length; j++) {
    chips += '<span class="tbar-chip">' + esc(act[j].title || 'Item') + ' <b>' + act[j].mins + 'm</b></span>';
  }
  var html = '<div class="tbar-top">';
  html += '<span class="tbar-lbl">Time allocation</span>';
  html += '<span class="tbar-val ' + cls + '">' + used + 'm / ' + total + 'm &mdash; ' + msg + '</span>';
  html += '</div>';
  html += '<div class="tbar-track"><div class="tbar-fill" style="width:' + pct + '%;background:' + col + '"></div></div>';
  if (chips) html += '<div class="tbar-chips">' + chips + '</div>';
  box.innerHTML = html;
}

/* PREVIEW */
function render() {
  var box = el('prv');
  var title = val('fTitle');
  if (!title) {
    box.innerHTML = '<div class="prv-empty"><div class="ico">&#128197;</div><h3>Enter a meeting title to get started</h3><p style="font-size:13px">Fill in the form on the left &#8212; your agenda will appear here.</p></div>';
    return;
  }
  var act = agenda.filter(function(a){ return a.on; });
  var dur = parseInt(val('fDur')) || 60;
  var durLbl = dur >= 60 ? (dur % 60 === 0 ? (dur / 60) + 'h' : Math.floor(dur / 60) + 'h ' + (dur % 60) + 'm') : dur + 'm';
  var h = '<div class="prv-title">&#128197; ' + esc(title) + '</div>';
  var meta = [];
  if (OPT.oType) meta.push('<strong>' + esc(val('fType')) + '</strong>');
  if (OPT.oDate && val('fDate')) {
    var d = new Date(val('fDate') + 'T00:00');
    var dl = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
    meta.push('&#128198; ' + dl + (val('fTime') ? ' at ' + val('fTime') : ''));
  }
  meta.push('&#9201; ' + durLbl);
  if (OPT.oLoc && val('fLoc')) meta.push('&#128205; ' + esc(val('fLoc')));
  if (OPT.oFac && val('fFac')) meta.push('&#128100; ' + esc(val('fFac')));
  h += '<div class="prv-meta">' + meta.join(' &nbsp;&middot;&nbsp; ') + '</div>';

  if (OPT.oPpl && peeps.length) {
    h += '<div class="prv-sec"><div class="prv-sec-hd">&#128101; Participants (' + peeps.length + ')</div><div class="prv-chips">';
    for (var i = 0; i < peeps.length; i++) {
      var p = peeps[i];
      h += '<span class="prv-chip">' + esc(p.name || 'TBD') + (p.role ? '<span class="rl">&nbsp;&mdash; ' + esc(p.role) + '</span>' : '') + '</span>';
    }
    h += '</div></div>';
  }

  if (act.length) {
    h += '<div class="prv-sec"><div class="prv-sec-hd">&#128203; Agenda</div>';
    for (var j = 0; j < act.length; j++) {
      var a = act[j];
      var pts = (a.pts || '').split('\n');
      var ptList = [];
      for (var k = 0; k < pts.length; k++) {
        var pt = pts[k].trim().replace(/^[*\-•]\s*/, '');
        if (pt) ptList.push(pt);
      }
      h += '<div class="prv-ag"><div class="prv-ag-n">' + (j + 1) + '</div><div class="prv-ag-b">';
      h += '<div class="prv-ag-t">' + esc(a.title || 'Untitled');
      if (OPT.oMin && a.mins) h += '<span class="prv-badge">' + a.mins + ' min</span>';
      h += '</div>';
      if (OPT.oPts && ptList.length) {
        h += '<ul class="prv-pts">';
        for (var m = 0; m < ptList.length; m++) h += '<li>' + esc(ptList[m]) + '</li>';
        h += '</ul>';
      }
      h += '</div></div>';
    }
    h += '</div>';
  }

  if (OPT.oBk && act.length) {
    var used2 = 0;
    for (var n = 0; n < act.length; n++) used2 += parseInt(act[n].mins) || 0;
    h += '<div class="prv-sec"><div class="prv-sec-hd">&#9201; Time Breakdown</div><div class="prv-bk">';
    for (var o = 0; o < act.length; o++) {
      h += '<div class="prv-br"><span>' + esc(act[o].title || 'Item') + '</span><span class="v">' + act[o].mins + ' min</span></div>';
    }
    h += '<div class="prv-br tot"><span>Total</span><span class="v">' + used2 + ' / ' + dur + ' min</span></div></div></div>';
  }
  box.innerHTML = h;
}

/* PLAIN TEXT */
function getPlain() {
  var title = val('fTitle') || 'Meeting Agenda';
  var act = agenda.filter(function(a){ return a.on; });
  var dur = parseInt(val('fDur')) || 60;
  var SEP = '----------------------------------------------------';
  var L = [];
  L.push(title.toUpperCase());
  L.push(SEP);
  if (OPT.oType) L.push('Type:        ' + val('fType'));
  if (OPT.oDate && val('fDate')) {
    var d = new Date(val('fDate') + 'T00:00');
    var dl2 = d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    L.push('Date:        ' + dl2 + (val('fTime') ? ' at ' + val('fTime') : ''));
  }
  var durLbl2 = dur >= 60 ? (dur % 60 === 0 ? (dur / 60) + 'h' : Math.floor(dur / 60) + 'h ' + (dur % 60) + 'm') : dur + 'm';
  L.push('Duration:    ' + durLbl2);
  if (OPT.oLoc && val('fLoc')) L.push('Location:    ' + val('fLoc'));
  if (OPT.oFac && val('fFac')) L.push('Facilitator: ' + val('fFac'));
  L.push('');
  if (OPT.oPpl && peeps.length) {
    L.push('PARTICIPANTS');
    L.push(SEP);
    for (var i = 0; i < peeps.length; i++) {
      var p = peeps[i];
      L.push('  - ' + (p.name || 'TBD') + (p.role ? ' (' + p.role + ')' : ''));
    }
    L.push('');
  }
  if (act.length) {
    L.push('AGENDA');
    L.push(SEP);
    for (var j = 0; j < act.length; j++) {
      var a = act[j];
      L.push((j + 1) + '. ' + (a.title || 'Untitled') + (OPT.oMin && a.mins ? ' (' + a.mins + ' min)' : ''));
      if (OPT.oPts && a.pts) {
        var pts2 = a.pts.split('\n');
        for (var k = 0; k < pts2.length; k++) {
          var pt2 = pts2[k].trim();
          if (pt2) L.push('   ' + (pt2.match(/^[-•]/) ? pt2 : '- ' + pt2));
        }
      }
      L.push('');
    }
  }
  if (OPT.oBk && act.length) {
    var used3 = 0;
    for (var n = 0; n < act.length; n++) used3 += parseInt(act[n].mins) || 0;
    L.push('TIME BREAKDOWN');
    L.push(SEP);
    for (var o = 0; o < act.length; o++) {
      var lbl = (act[o].title || 'Item');
      while (lbl.length < 38) lbl += ' ';
      L.push('  ' + lbl + act[o].mins + ' min');
    }
    var totLbl = 'Total';
    while (totLbl.length < 38) totLbl += ' ';
    L.push('  ' + totLbl + used3 + ' / ' + dur + ' min');
    L.push('');
  }
  L.push(SEP);
  L.push('Generated by QuickTools - ' + new Date().toLocaleDateString());
  return L.join('\n');
}

function cpText() {
  navigator.clipboard.writeText(getPlain()).then(function(){ showToast('Plain text copied — ready to paste in email!'); });
}

function getExportCSS() {
  var c = '';
  c += '.prv-title{font-size:22px;font-weight:800;color:#1d4ed8;margin-bottom:5px}';
  c += '.prv-meta{font-size:13px;color:#475569;margin-bottom:24px;line-height:2}';
  c += '.prv-sec{margin-bottom:26px}';
  c += '.prv-sec-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6d28d9;padding-bottom:7px;margin-bottom:13px;border-bottom:2px solid #e2e8f0}';
  c += '.prv-chips{display:flex;flex-wrap:wrap;gap:6px}';
  c += '.prv-chip{display:inline-flex;align-items:center;gap:5px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:99px;padding:4px 12px;font-size:12px;color:#334155}';
  c += '.prv-chip .rl{color:#94a3b8;font-size:11px}';
  c += '.prv-ag{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}';
  c += '.prv-ag-n{min-width:26px;height:26px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1d4ed8;flex-shrink:0;margin-top:1px}';
  c += '.prv-ag-b{flex:1}';
  c += '.prv-ag-t{font-size:15px;font-weight:700;color:#0f172a;display:flex;align-items:center;justify-content:space-between;gap:8px}';
  c += '.prv-badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:600;flex-shrink:0}';
  c += '.prv-pts{margin-top:6px;list-style:none;padding:0}';
  c += '.prv-pts li{font-size:13px;color:#475569;padding:2px 0 2px 15px;position:relative}';
  c += '.prv-pts li::before{content:"\\2022";position:absolute;left:0;color:#a78bfa}';
  c += '.prv-bk{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}';
  c += '.prv-br{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}';
  c += '.prv-br:last-child{border-bottom:none}';
  c += '.prv-br.tot{background:#f0f9ff;font-weight:700;color:#1d4ed8}';
  c += '.prv-br .v{color:#64748b;font-weight:600}';
  c += '.prv-br.tot .v{color:#1d4ed8}';
  return c;
}

function buildExportHTML(inner, titleText) {
  var css = getExportCSS();
  var parts = [];
  parts.push('<html lang="en"><head><meta charset="UTF-8"><title>');
  parts.push(esc(titleText));
  parts.push('<\/title><style>');
  parts.push('body{font-family:Arial,sans-serif;background:#f8faff;color:#0f172a;padding:40px;max-width:780px;margin:0 auto;font-size:14px;line-height:1.65}');
  parts.push('footer{margin-top:36px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:12px;text-align:center}');
  parts.push(css);
  parts.push('<\/style><\/head><body>');
  parts.push(inner);
  parts.push('<footer>Generated by QuickTools Meeting Agenda Generator &middot; ');
  parts.push(new Date().toLocaleDateString());
  parts.push('<\/footer><\/body><\/html>');
  return parts.join('');
}

function cpRich() {
  var inner = el('prv').innerHTML;
  var css = getExportCSS();
  var parts = [];
  parts.push('<html><head><meta charset="UTF-8"><style>');
  parts.push(css);
  parts.push('<\/style><\/head><body><div style="max-width:700px;padding:20px">');
  parts.push(inner);
  parts.push('<\/div><\/body><\/html>');
  var full = parts.join('');
  try {
    var item = new ClipboardItem({
      'text/html': new Blob([full], {type: 'text/html'}),
      'text/plain': new Blob([getPlain()], {type: 'text/plain'})
    });
    navigator.clipboard.write([item]).then(function(){ showToast('Rich HTML copied — paste into email!'); });
  } catch(err) { cpText(); }
}

function expHTML() {
  var title = val('fTitle') || 'Meeting Agenda';
  var inner = el('prv').innerHTML;
  var full = buildExportHTML(inner, title);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([full], {type: 'text/html'}));
  a.download = 'MeetingAgenda_' + title.replace(/\s+/g, '-').slice(0, 40) + '_' + new Date().toISOString().slice(0, 10) + '.html';
  a.click();
  showToast('Agenda exported!');
}

function showToast(msg) {
  var t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

(function init() {
  var now = new Date();
  el('fDate').value = now.toISOString().slice(0, 10);
  var hh = String(now.getHours()).padStart(2, '0');
  var raw = Math.round(now.getMinutes() / 15) * 15;
  el('fTime').value = hh + ':' + String(raw >= 60 ? 0 : raw).padStart(2, '0');
  el('fTitle').value = 'Sprint 12 Planning';
  el('fFac').value = 'Alice Johnson';
  el('fLoc').value = 'Microsoft Teams';

  peeps.push({id: seq++, name: 'Alice Johnson', role: 'Tech Lead'});
  peeps.push({id: seq++, name: 'Bob Smith', role: 'Senior Developer'});
  peeps.push({id: seq++, name: 'Carol White', role: 'Business Analyst'});
  peeps.push({id: seq++, name: 'David Lee', role: 'QA Engineer'});
  drawP();

  var defs = [
    ['Welcome & Introductions', 5, '- Quick round of introductions\n- Confirm agenda and any amendments'],
    ['Sprint 11 Review', 10, '- Velocity recap: 42/48 story points delivered\n- Demo highlights from last sprint\n- Open action items from previous meeting'],
    ['Backlog Grooming & Prioritisation', 20, '- Review top 10 backlog items\n- Story point estimation and acceptance criteria\n- Identify dependencies and blockers'],
    ['Sprint 12 Goal & Scope', 15, '- Define the sprint goal statement\n- Confirm team capacity and availability\n- Agree on sprint commitment'],
    ['Technical Risks & Decisions', 5, '- Azure Service Bus migration dependency\n- Flag any new risks or blockers'],
    ['Action Items & Next Steps', 5, '- Capture owners and due dates\n- Confirm next meeting time']
  ];
  for (var i = 0; i < defs.length; i++) {
    agenda.push({id: seq++, title: defs[i][0], mins: defs[i][1], pts: defs[i][2], on: true, open: false});
  }
  drawA();
  render();
}());
</script>
