<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definition of Done Checklist — QuickTools</title>
<style>
:root{
  --bg:#f0fdfa;--surface:#fff;--border:#99f6e4;
  --accent:#0d9488;--accent2:#059669;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;
  --text:#1e293b;--muted:#64748b;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.hdr{background:linear-gradient(135deg,#0f766e,#0d9488);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;box-shadow:0 2px 12px rgba(15,118,110,.25);}
.hdr-icon{width:40px;height:40px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.hdr-title{font-size:17px;font-weight:700;color:#fff;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.8);margin-top:2px;}
.hdr-actions{margin-left:auto;display:flex;gap:8px;}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;white-space:nowrap;}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);}
.btn-ghost:hover{background:rgba(255,255,255,.3);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#0f766e;}
.btn-danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:4px 10px;font-size:11px;}
.app{flex:1;display:flex;overflow:hidden;}
.sb{width:220px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0;flex-shrink:0;}
.sb-lbl{padding:12px 14px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-top:1px solid var(--border);margin-top:6px;}
.sb-lbl:first-child{border-top:none;margin-top:0;padding-top:10px;}
.sb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 14px;border:none;border-left:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:500;text-align:left;transition:all .15s;}
.sb-btn .lbl{display:flex;align-items:center;gap:8px;}
.sb-btn:hover{background:#f0fdfa;color:var(--text);}
.sb-btn.on{background:#f0fdfa;border-left-color:var(--accent);color:var(--accent);font-weight:700;}
.sb-pct{font-size:10px;background:var(--border);border-radius:99px;padding:1px 6px;color:var(--muted);}
.sb-btn.on .sb-pct{background:#ccfbf1;color:var(--accent);}
.main{flex:1;overflow-y:auto;}
.content{padding:24px;max-width:860px;margin:0 auto;}
.panel{display:none;}
.panel.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 1px 6px rgba(13,148,136,.07);}
.card-hd{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:16px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.fg input,.fg select{border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);background:var(--surface);transition:border-color .15s;font-family:inherit;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--accent);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cat-section{margin-bottom:18px;}
.cat-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding:6px 0 8px;border-bottom:2px solid var(--border);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;transition:background .15s;cursor:pointer;}
.check-item:hover{background:#f0fdfa;}
.check-item.done{opacity:.6;}
.check-item.done .check-lbl{text-decoration:line-through;color:var(--muted);}
.check-cb{width:18px;height:18px;border:2px solid #99f6e4;border-radius:5px;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;}
.check-item.done .check-cb{background:var(--accent);border-color:var(--accent);}
.check-lbl{font-size:13px;line-height:1.4;}
.check-req{font-size:10px;color:var(--red);font-weight:700;margin-left:4px;}
.progress-bar-wrap{background:#e2e8f0;border-radius:99px;height:10px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;transition:width .4s;background:linear-gradient(90deg,#0d9488,#059669);}
.ship-badge{background:linear-gradient(135deg,#059669,#0d9488);color:#fff;border-radius:12px;padding:16px 24px;text-align:center;margin-bottom:18px;box-shadow:0 4px 20px rgba(13,148,136,.3);}
.ship-badge .icon{font-size:36px;margin-bottom:6px;}
.ship-badge .title{font-size:18px;font-weight:800;}
.ship-badge .sub{font-size:12px;opacity:.85;margin-top:4px;}
.inst-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;}
.inst-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(13,148,136,.15);}
.inst-pct-ring{width:44px;height:44px;flex-shrink:0;position:relative;}
.inst-info{flex:1;}
.inst-name{font-size:14px;font-weight:700;}
.inst-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .ico{font-size:40px;margin-bottom:8px;}
input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-icon">✅</div>
  <div>
    <div class="hdr-title">Definition of Done Checklist</div>
    <div class="hdr-sub">Templates · Sprint Instances · Release Gates</div>
  </div>
  <div class="hdr-actions">
    <button class="btn btn-ghost btn-sm" onclick="exportData()">Export JSON</button>
    <button class="btn btn-ghost btn-sm" onclick="importData()">Import</button>
  </div>
</div>
<div class="app">
  <div class="sb">
    <div class="sb-lbl">Instances</div>
    <div id="sb-instances"></div>
    <button class="sb-btn" onclick="nav('new-inst')"><span class="lbl">＋ New Instance</span></button>
    <div class="sb-lbl">Manage</div>
    <button class="sb-btn" id="nav-templates" onclick="nav('templates')"><span class="lbl">📋 Templates</span></button>
  </div>
  <div class="main">
    <div class="content">

      <!-- Instance View -->
      <div class="panel" id="panel-instance">
        <div id="instance-content"></div>
      </div>

      <!-- New Instance Panel -->
      <div class="panel on" id="panel-new-inst">
        <div class="card">
          <div class="card-hd">Create New Checklist Instance</div>
          <div class="g2">
            <div class="fg"><label>Name</label><input id="ni-name" placeholder="e.g. Sprint 42 or v2.3 Release"/></div>
            <div class="fg"><label>Template</label><select id="ni-template"></select></div>
          </div>
          <button class="btn btn-primary" onclick="createInstance()">Create Checklist</button>
        </div>
        <div class="card">
          <div class="card-hd">Recent Instances</div>
          <div id="inst-list"></div>
        </div>
      </div>

      <!-- Templates Panel -->
      <div class="panel" id="panel-templates">
        <div id="template-content"></div>
      </div>

    </div>
  </div>
</div>
<script>
const SK = 'dod-v1';
const DEFAULT_TEMPLATE = {
  id:'t-default', name:'Standard Feature Release',
  categories:[
    { name:'Code Quality', items:['Code review approved by 2 reviewers','No new critical/high lint errors','Unit tests written for new logic','Code coverage maintained or improved','No hardcoded secrets or credentials'] },
    { name:'Testing', items:['All unit tests passing','Integration tests passing','Regression test suite passed','Manual QA sign-off on AC','Edge cases and error states tested'] },
    { name:'Documentation', items:['API documentation updated','README updated if setup changed','Changelog entry added','Architecture decision recorded if needed'] },
    { name:'Deployment', items:['DB migrations tested on staging','Feature flags configured','Environment variables documented','Rollback plan documented','Monitoring/alerts configured'] },
    { name:'Sign-off', items:['Product Owner approved','Tech Lead approved','Security review done (if sensitive)'] }
  ]
};

let S = (() => {
  const d = localStorage.getItem(SK);
  if(d) return JSON.parse(d);
  return { templates:[DEFAULT_TEMPLATE], instances:[], nid:1, currentInst:null };
})();
let activePanel = 'new-inst';
let currentInst = null;

function save(){ localStorage.setItem(SK, JSON.stringify(S)); }
function nid(){ return 'id'+(S.nid++); }

function nav(p, instId){
  activePanel = p;
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.sb-btn').forEach(el=>el.classList.remove('on'));
  document.getElementById('panel-'+p).classList.add('on');
  const nb=document.getElementById('nav-'+p);
  if(nb) nb.classList.add('on');
  if(p==='instance' && instId){ currentInst=instId; renderInstance(instId); }
  if(p==='new-inst'){ renderNewInst(); }
  if(p==='templates'){ renderTemplates(); }
  renderSB();
}

function instPct(inst){
  const tpl = S.templates.find(t=>t.id===inst.templateId);
  if(!tpl) return 0;
  const allItems = tpl.categories.flatMap(c=>c.items);
  if(!allItems.length) return 0;
  const done = allItems.filter(i=>inst.checks[i]).length;
  return Math.round(done/allItems.length*100);
}

function renderSB(){
  const sorted = [...S.instances].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  document.getElementById('sb-instances').innerHTML = sorted.map(inst=>{
    const pct=instPct(inst);
    const done=pct===100;
    return `<button class="sb-btn${currentInst===inst.id?' on':''}" onclick="nav('instance','${inst.id}')">
      <span class="lbl">${done?'✅ ':''}<span style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${inst.name}</span></span>
      <span class="sb-pct">${pct}%</span>
    </button>`;
  }).join('') || '<div style="padding:8px 14px;font-size:12px;color:var(--muted)">No instances yet</div>';
}

function renderInstance(instId){
  const inst = S.instances.find(i=>i.id===instId);
  if(!inst){ document.getElementById('instance-content').innerHTML='<div class="empty"><div class="ico">✅</div><div>Instance not found.</div></div>'; return; }
  const tpl = S.templates.find(t=>t.id===inst.templateId);
  if(!tpl){ document.getElementById('instance-content').innerHTML='<div class="empty">Template not found.</div>'; return; }
  const allItems = tpl.categories.flatMap(c=>c.items);
  const done = allItems.filter(i=>inst.checks[i]).length;
  const pct = allItems.length?Math.round(done/allItems.length*100):0;
  const remaining = allItems.filter(i=>!inst.checks[i]).length;

  let html = '';
  if(pct===100){
    html += `<div class="ship-badge"><div class="icon">🚀</div><div class="title">Ready to Ship!</div><div class="sub">All ${allItems.length} checks passed · ${inst.name}</div></div>`;
  }

  html += `<div class="card">
    <div class="card-hd">${inst.name} <span style="font-weight:400;color:var(--muted);font-size:11px;text-transform:none">created ${inst.createdAt}</span>
      <button class="btn btn-danger btn-sm" onclick="deleteInst('${inst.id}')">Delete</button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="progress-bar-wrap" style="flex:1"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div style="font-size:20px;font-weight:800;color:var(--accent);min-width:48px">${pct}%</div>
    </div>
    <div style="font-size:12px;color:var(--muted)">${done} of ${allItems.length} checks complete${remaining?` · ${remaining} remaining`:' 🎉'}</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn btn-sm" style="background:#f0fdfa;border:1px solid var(--border);color:var(--accent)" onclick="checkAll('${inst.id}')">Check All</button>
      <button class="btn btn-sm" style="background:#fff7ed;border:1px solid #fed7aa;color:#d97706" onclick="uncheckAll('${inst.id}')">Uncheck All</button>
      <button class="btn btn-sm" style="background:#f1f5f9;border:1px solid #e2e8f0;color:var(--muted)" onclick="printInst()">Print / Export</button>
    </div>
  </div>`;

  for(const cat of tpl.categories){
    const catDone = cat.items.filter(i=>inst.checks[i]).length;
    html += `<div class="cat-section">
      <div class="cat-hd">${cat.name} <span style="font-weight:400;color:var(--muted)">${catDone}/${cat.items.length}</span></div>
      ${cat.items.map(item=>{
        const checked = !!inst.checks[item];
        return `<div class="check-item${checked?' done':''}" onclick="toggleCheck('${inst.id}','${esc(item)}')">
          <div class="check-cb">${checked?'<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,5 4,8 10,1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
          <span class="check-lbl">${item}</span>
        </div>`;
      }).join('')}
    </div>`;
  }

  document.getElementById('instance-content').innerHTML = html;
}

function esc(s){ return s.replace(/'/g,"\\'"); }

function toggleCheck(instId, item){
  const inst = S.instances.find(i=>i.id===instId);
  if(!inst) return;
  inst.checks[item] = !inst.checks[item];
  save(); renderInstance(instId); renderSB();
}

function checkAll(instId){
  const inst = S.instances.find(i=>i.id===instId);
  const tpl = inst && S.templates.find(t=>t.id===inst.templateId);
  if(!tpl) return;
  tpl.categories.flatMap(c=>c.items).forEach(i=>{ inst.checks[i]=true; });
  save(); renderInstance(instId); renderSB();
}
function uncheckAll(instId){
  const inst = S.instances.find(i=>i.id===instId);
  if(!inst) return;
  inst.checks={};
  save(); renderInstance(instId); renderSB();
}

function renderNewInst(){
  const sel = document.getElementById('ni-template');
  if(sel) sel.innerHTML = S.templates.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  const sorted = [...S.instances].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  document.getElementById('inst-list').innerHTML = sorted.length ? sorted.slice(0,6).map(inst=>{
    const pct=instPct(inst);
    return `<div class="inst-card" onclick="nav('instance','${inst.id}')">
      <div style="width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) ${pct*3.6}deg, #e2e8f0 0);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <div style="width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent)">${pct}%</div>
      </div>
      <div class="inst-info">
        <div class="inst-name">${inst.name}</div>
        <div class="inst-meta">${inst.createdAt} · ${S.templates.find(t=>t.id===inst.templateId)?.name||'Unknown template'}</div>
      </div>
      ${pct===100?'<span style="font-size:20px">🚀</span>':''}
    </div>`;
  }).join('') : '<div class="empty"><div class="ico">📋</div><div>No instances yet. Create one above.</div></div>';
}

function createInstance(){
  const name = document.getElementById('ni-name').value.trim();
  if(!name){ alert('Name required'); return; }
  const tplId = document.getElementById('ni-template').value;
  const inst = { id:nid(), name, templateId:tplId, createdAt:new Date().toISOString().split('T')[0], checks:{} };
  S.instances.push(inst);
  save();
  document.getElementById('ni-name').value='';
  nav('instance', inst.id);
}

function deleteInst(id){
  if(!confirm('Delete this checklist instance?')) return;
  S.instances = S.instances.filter(i=>i.id!==id);
  if(currentInst===id) currentInst=null;
  save(); nav('new-inst');
}

function renderTemplates(){
  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-primary btn-sm" onclick="addTemplate()">＋ New Template</button></div>`;
  html += S.templates.map(tpl=>`
    <div class="card">
      <div class="card-hd">${tpl.name}
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" style="background:#f0fdfa;border:1px solid var(--border);color:var(--accent)" onclick="nav('new-inst')">Use Template</button>
          ${tpl.id==='t-default'?'':'<button class="btn btn-danger btn-sm" onclick="deleteTemplate(\''+tpl.id+'\')">Delete</button>'}
        </div>
      </div>
      ${tpl.categories.map(cat=>`
        <div style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
            ${cat.name}
            <button class="btn btn-sm" style="background:#f0fdfa;border:1px solid var(--border);color:var(--accent);font-size:10px" onclick="addItemToCategory('${tpl.id}','${esc(cat.name)}')">＋ Item</button>
          </div>
          ${cat.items.map((item,ii)=>`
            <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px;background:#f0fdfa;margin-bottom:3px">
              <span style="flex:1">${item}</span>
              ${tpl.id==='t-default'?'':'<button class="btn btn-danger btn-sm" onclick="removeItem(\''+tpl.id+'\',\''+esc(cat.name)+'\','+ii+')">✕</button>'}
            </div>`).join('')}
        </div>`).join('')}
      ${tpl.id!=='t-default'?`<button class="btn btn-sm" style="background:#f0fdfa;border:1px solid var(--border);color:var(--accent)" onclick="addCategoryToTemplate('${tpl.id}')">＋ Category</button>`:''}
    </div>`).join('');
  document.getElementById('template-content').innerHTML = html;
}

function addTemplate(){
  const name = prompt('Template name:');
  if(!name||!name.trim()) return;
  S.templates.push({id:nid(),name:name.trim(),categories:[]});
  save(); renderTemplates();
}
function deleteTemplate(id){
  if(!confirm('Delete this template?')) return;
  S.templates=S.templates.filter(t=>t.id!==id);
  save(); renderTemplates();
}
function addCategoryToTemplate(tplId){
  const name=prompt('Category name:');
  if(!name||!name.trim()) return;
  const tpl=S.templates.find(t=>t.id===tplId);
  if(tpl){ tpl.categories.push({name:name.trim(),items:[]}); save(); renderTemplates(); }
}
function addItemToCategory(tplId, catName){
  const text=prompt('Checklist item:');
  if(!text||!text.trim()) return;
  const tpl=S.templates.find(t=>t.id===tplId);
  const cat=tpl&&tpl.categories.find(c=>c.name===catName);
  if(cat){ cat.items.push(text.trim()); save(); renderTemplates(); }
}
function removeItem(tplId, catName, idx){
  const tpl=S.templates.find(t=>t.id===tplId);
  const cat=tpl&&tpl.categories.find(c=>c.name===catName);
  if(cat){ cat.items.splice(idx,1); save(); renderTemplates(); }
}

function printInst(){
  window.print();
}

function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='dod-data.json'; a.click();
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const fr=new FileReader();
    fr.onload=ev=>{ try{ S=JSON.parse(ev.target.result); save(); nav('new-inst'); }catch{ alert('Invalid JSON'); } };
    fr.readAsText(e.target.files[0]);
  }; inp.click();
}

renderSB();
renderNewInst();
</script>
</body>
</html>
